<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рыбалка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a1929;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }
  #game {
    width: 100%;
    max-width: 500px;
    height: 100vh;
    max-height: 800px;
    position: relative;
    background: linear-gradient(180deg, #7EC8E3 0%, #5DADE2 35%, #1B4F72 100%);
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  .sun { position: absolute; top: 30px; right: 40px; width: 90px; height: 90px; }
  .sun svg { width: 100%; height: 100%; animation: sunPulse 4s ease-in-out infinite; }
  @keyframes sunPulse {
    0%,100% { filter: drop-shadow(0 0 20px #FFD54F); }
    50% { filter: drop-shadow(0 0 35px #FFEB3B); }
  }
  .cloud { position: absolute; opacity: 0.85; animation: cloudMove 30s linear infinite; }
  .cloud.c1 { top: 60px; left: -120px; width: 100px; animation-duration: 35s; }
  .cloud.c2 { top: 120px; left: -120px; width: 70px; animation-duration: 45s; animation-delay: -15s; }
  @keyframes cloudMove {
    0% { transform: translateX(0); }
    100% { transform: translateX(650px); }
  }
  .water {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 55%;
    background: linear-gradient(180deg, #2874A6 0%, #154360 100%);
  }
  .water::before {
    content: '';
    position: absolute;
    top: -6px; left: 0; right: 0;
    height: 12px;
    background: repeating-linear-gradient(90deg,
      transparent 0px, transparent 20px,
      rgba(255,255,255,0.3) 20px, rgba(255,255,255,0.3) 40px);
    border-radius: 50%;
    animation: wave 3s linear infinite;
  }
  @keyframes wave {
    0% { transform: translateX(0); }
    100% { transform: translateX(40px); }
  }
  .fisher {
    position: absolute;
    bottom: 55%;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 80px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    z-index: 3;
  }
  #rod {
    position: absolute;
    bottom: calc(55% + 40px);
    left: 50%;
    width: 3px;
    height: 60px;
    background: linear-gradient(180deg, #8B4513, #5D3A1A);
    transform-origin: bottom center;
    transform: translateX(20px) rotate(30deg);
    z-index: 2;
    border-radius: 2px;
    transition: transform 0.2s;
  }
  #line {
    position: absolute;
    bottom: calc(55% + 40px);
    left: 50%;
    width: 2px;
    height: 0px;
    background: rgba(255,255,255,0.75);
    transform-origin: top center;
    transition: height 0.15s linear;
    z-index: 5;
    margin-left: 46px;
  }
  #bobber {
    position: absolute;
    width: 18px;
    height: 26px;
    transform: translate(-50%, 0);
    z-index: 6;
    transition: transform 0.08s;
    display: none;
  }
  #bobber svg { width: 100%; height: 100%; }
  .fish {
    position: absolute;
    width: 60px;
    height: 44px;
    transition: opacity 0.4s, transform 0.4s;
    pointer-events: none;
    z-index: 4;
    animation: fishSwim 2s ease-in-out infinite;
  }
  @keyframes fishSwim {
    0%,100% { transform: translateX(0); }
    50% { transform: translateX(-10px); }
  }
  .fish.reeling {
    animation: reel 0.5s ease-out forwards;
  }
  @keyframes reel {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(-100px, -200px) rotate(-45deg); opacity: 0; }
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    color: white;
    font-weight: bold;
    font-size: 18px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    z-index: 20;
  }
  #score, #time, #best {
    background: rgba(0,0,0,0.35);
    padding: 8px 18px 8px 12px;
    border-radius: 20px;
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  #best { padding: 8px 14px; font-size: 14px; }
  #score svg, #time svg, #best svg { width: 22px; height: 22px; }
  #best svg { width: 18px; height: 18px; }
  #actionBtn {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 16px 45px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    background: linear-gradient(180deg, #F39C12, #E67E22);
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 0 #A04000, 0 10px 20px rgba(0,0,0,0.4);
    transition: all 0.1s;
    z-index: 20;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  #actionBtn:active {
    transform: translateX(-50%) translateY(4px);
    box-shadow: 0 2px 0 #A04000, 0 4px 10px rgba(0,0,0,0.4);
  }
  #actionBtn:disabled {
    background: #7F8C8D;
    box-shadow: 0 6px 0 #566573;
    cursor: not-allowed;
  }
  #catch {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(255,255,255,0.97);
    padding: 18px 30px;
    border-radius: 20px;
    font-size: 22px;
    font-weight: bold;
    color: #E67E22;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    z-index: 30;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: center;
    display: flex;
    align-items: center;
    gap: 12px;
    white-space: nowrap;
  }
  #catch.show { transform: translate(-50%, -50%) scale(1); }
  #catch svg { width: 40px; height: 30px; flex-shrink: 0; }
  #gameover {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    z-index: 50;
    gap: 16px;
    padding: 30px;
    text-align: center;
  }
  #gameover.show { display: flex; }
  #gameover h1 { font-size: 36px; color: #FFD700; letter-spacing: 2px; }
  #gameover p { font-size: 20px; opacity: 0.9; }
  #gameover .record { color: #FFD700; font-size: 22px; font-weight: bold; }
  #stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    font-size: 15px;
    opacity: 0.85;
    margin: 8px 0;
  }
  #stats div { background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 10px; }
  #restartBtn {
    padding: 15px 45px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    background: linear-gradient(180deg, #2ECC71, #27AE60);
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 0 #1E8449;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 10px;
  }
  #restartBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #1E8449;
  }
  #tensionBar {
    position: absolute;
    bottom: 110px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 24px;
    background: rgba(0,0,0,0.5);
    border-radius: 12px;
    overflow: hidden;
    display: none;
    z-index: 20;
    border: 2px solid rgba(255,255,255,0.7);
  }
  #tensionFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2ECC71, #F39C12, #E74C3C);
    transition: width 0.05s;
  }
  #perfectZone {
    position: absolute;
    top: 0; bottom: 0;
    background: rgba(255,255,255,0.35);
    border-left: 2px solid #FFF;
    border-right: 2px solid #FFF;
    pointer-events: none;
    display: none;
  }
  #muteBtn {
    position: absolute;
    top: 60px;
    right: 15px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
  }
  #muteBtn svg { width: 22px; height: 22px; }
  #splash {
    position: absolute;
    pointer-events: none;
    z-index: 8;
    display: none;
  }
  #splash.active { display: block; animation: splash 0.7s ease-out forwards; }
  @keyframes splash {
    0% { transform: translate(-50%, 0) scale(0.3); opacity: 1; }
    100% { transform: translate(-50%, 0) scale(1.5); opacity: 0; }
  }
</style>
</head>
<body>

<script>
  // ==================== SVG ИКОНКИ РЫБ ====================
function fishSVG(type, size = 60) {
  const svgs = {
    perch: `<svg viewBox="0 0 60 44" width="${size}">
      <path d="M5 22 Q22 4 42 22 Q22 40 5 22 Z" fill="#7CB342" stroke="#33691E" stroke-width="1.5"/>
      <path d="M42 22 L56 12 L56 32 Z" fill="#7CB342" stroke="#33691E" stroke-width="1.5"/>
      <path d="M15 15 L20 29 M22 12 L27 32 M29 12 L34 32" stroke="#33691E" stroke-width="1.5" fill="none"/>
      <circle cx="14" cy="19" r="2.5" fill="#1B5E20"/>
      <circle cx="14" cy="19" r="1" fill="#000"/>
      <path d="M6 22 L2 20 L2 24 Z" fill="#33691E"/>
    </svg>`,
    carp: `<svg viewBox="0 0 60 44" width="${size}">
      <path d="M5 22 Q22 6 42 22 Q22 38 5 22 Z" fill="#FFB300" stroke="#E65100" stroke-width="1.5"/>
      <path d="M42 22 L56 10 L58 22 L56 34 Z" fill="#FF8F00" stroke="#E65100" stroke-width="1.5"/>
      <path d="M20 12 Q22 8 26 12 M26 10 Q28 6 32 10" stroke="#E65100" stroke-width="1.2" fill="none"/>
      <circle cx="14" cy="19" r="2.8" fill="#FFF"/>
      <circle cx="14" cy="19" r="1.5" fill="#000"/>
      <path d="M10 26 Q14 29 18 26" stroke="#E65100" stroke-width="1.2" fill="none"/>
    </svg>`,
    ruffe: `<svg viewBox="0 0 60 44" width="${size}">
      <path d="M5 22 Q22 8 42 22 Q22 36 5 22 Z" fill="#8D6E63" stroke="#3E2723" stroke-width="1.5"/>
      <path d="M42 22 L56 12 L56 32 Z" fill="#8D6E63" stroke="#3E2723" stroke-width="1.5"/>
      <path d="M12 8 L16 14 M20 6 L23 13 M28 6 L30 13 M36 8 L37 14" stroke="#3E2723" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <circle cx="14" cy="19" r="2.5" fill="#FFEB3B"/>
      <circle cx="14" cy="19" r="1.3" fill="#000"/>
      <path d="M6 22 L2 20 L2 24 Z" fill="#3E2723"/>
    </svg>`,
    pike: `<svg viewBox="0 0 70 44" width="${size}">
      <path d="M5 22 Q25 6 50 20 L58 18 L54 22 L58 26 L50 24 Q25 38 5 22 Z" fill="#558B2F" stroke="#1B5E20" stroke-width="1.5"/>
      <path d="M50 20 L68 10 L66 22 L68 34 L50 24 Z" fill="#33691E" stroke="#1B5E20" stroke-width="1.5"/>
      <path d="M15 18 L18 26 M22 15 L25 29 M29 14 L32 30 M36 14 L38 30" stroke="#1B5E20" stroke-width="1.2" fill="none"/>
      <circle cx="13" cy="19" r="3" fill="#F44336"/>
      <circle cx="13" cy="19" r="1.5" fill="#000"/>
      <path d="M5 22 L1 19 L1 25 Z" fill="#1B5E20"/>
    </svg>`,
    catfish: `<svg viewBox="0 0 80 50" width="${size + 10}">
      <path d="M8 25 Q30 5 55 25 Q30 45 8 25 Z" fill="#455A64" stroke="#1A237E" stroke-width="1.8"/>
      <path d="M55 25 L74 12 L74 38 Z" fill="#37474F" stroke="#1A237E" stroke-width="1.8"/>
      <path d="M15 12 Q25 5 35 12" stroke="#1A237E" stroke-width="1.5" fill="none"/>
      <circle cx="18" cy="22" r="3.2" fill="#FFF"/>
      <circle cx="18" cy="22" r="1.7" fill="#000"/>
      <path d="M8 25 Q2 22 -2 24 M8 25 Q2 28 -2 26" stroke="#1A237E" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>`,
    boot: `<svg viewBox="0 0 60 50" width="${size}">
      <path d="M15 8 L15 30 Q15 38 8 40 L55 40 Q52 34 45 32 L40 30 L40 8 Z" fill="#5D4037" stroke="#3E2723" stroke-width="2"/>
      <path d="M15 8 L40 8" stroke="#3E2723" stroke-width="2"/>
      <path d="M15 35 L55 35" stroke="#3E2723" stroke-width="1.5"/>
      <ellipse cx="30" cy="44" rx="22" ry="4" fill="#2E7D32" opacity="0.7"/>
    </svg>`
  };
  return svgs[type] || svgs.perch;
}

// ==================== ЗВУКИ (Web Audio API) ====================
let audioCtx = null;
let muted = false;

function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { console.log('Audio unavailable'); }
  }
}

function playTone(freq, duration, type = 'sine', volume = 0.15, slideTo = null) {
  if (muted || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slideTo) {
    osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
  }
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

const sounds = {
  cast: () => playTone(600, 0.2, 'sine', 0.12, 200),
  bite: () => { playTone(800, 0.1, 'square', 0.1); setTimeout(() => playTone(1000, 0.1, 'square', 0.1), 100); },
  hook: () => playTone(400, 0.15, 'triangle', 0.2, 900),
  catch: () => { playTone(523, 0.1, 'sine', 0.15); setTimeout(() => playTone(659, 0.1, 'sine', 0.15), 100); setTimeout(() => playTone(784, 0.2, 'sine', 0.15), 200); },
  miss: () => playTone(300, 0.3, 'sawtooth', 0.1, 100),
  reel: () => playTone(200, 0.4, 'sawtooth', 0.08, 500),
  gameover: () => { playTone(400, 0.2, 'sine', 0.15); setTimeout(() => playTone(300, 0.2, 'sine', 0.15), 200); setTimeout(() => playTone(200, 0.4, 'sine', 0.15), 400); }
};

// ==================== СОСТОЯНИЕ ИГРЫ ====================

const finalScoreEl = document.getElementById('finalScore');
const recordLineEl = document.getElementById('recordLine');
const restartBtn = document.getElementById('restartBtn');
const tensionBar = document.getElementById('tensionBar');
const tensionFill = document.getElementById('tensionFill');
const perfectZoneEl = document.getElementById('perfectZone');
const muteBtn = document.getElementById('muteBtn');
const soundOn = document.getElementById('soundOn');
const soundOff = document.getElementById('soundOff');
const splashEl = document.getElementById('splash');
const statPointsEl = document.getElementById('statPoints');
const statMissedEl = document.getElementById('statMissed');
const statBootsEl = document.getElementById('statBoots');
const statBestEl = document.getElementById('statBest');

let state = 'idle';
let score = 0;
let timeLeft = 60;
let timerInterval = null;
let biteTimeout = null;
let currentFish = null;
let tension = 0;
let tensionDirection = 1;
let tensionInterval = null;
let perfectZone = null;
let stats = { points: 0, missed: 0, boots: 0 };
let bestScore = parseInt(localStorage.getItem('fishing_best') || '0', 10);

const FISH_TYPES = [
  { key: 'perch',   name: 'Окунь',          points: 1,  chance: 40, difficulty: 1,   color: '#27AE60' },
  { key: 'carp',    name: 'Карась',         points: 2,  chance: 25, difficulty: 1.5, color: '#E67E22' },
  { key: 'ruffe',   name: 'Ёрш',            points: 3,  chance: 15, difficulty: 2,   color: '#8D6E63' },
  { key: 'pike',    name: 'Щука',           points: 5,  chance: 12, difficulty: 2.5, color: '#558B2F' },
  { key: 'catfish', name: 'Сом-гигант',     points: 10, chance: 5,  difficulty: 3,   color: '#37474F' },
  { key: 'boot',    name: 'Старый ботинок', points: -1, chance: 3,  difficulty: 1,   color: '#E74C3C' }
];

function pickFish() {
  const total = FISH_TYPES.reduce((s, f) => s + f.chance, 0);
  let r = Math.random() * total;
  for (const f of FISH_TYPES) {
    r -= f.chance;
    if (r <= 0) return f;
  }
  return FISH_TYPES[0];
}

function updateHUD() {
  scoreTextEl.textContent = score;
  timeTextEl.textContent = timeLeft;
  bestTextEl.textContent = bestScore;
}

function showCatch(text, fishKey, color) {
  catchEl.innerHTML = fishSVG(fishKey, 45) + `<span>${text}</span>`;
  catchEl.style.color = color || '#E67E22';
  catchEl.classList.add('show');
  setTimeout(() => catchEl.classList.remove('show'), 900);
}

function showSplash() {
  splashEl.style.display = 'block';
  splashEl.style.left = bobberEl.style.left;
  splashEl.style.top = bobberEl.style.top;
  splashEl.classList.add('active');
  setTimeout(() => {
    splashEl.classList.remove('active');
    splashEl.style.display = 'none';
  }, 700);
}

// ==================== ЗАБРОС ====================
function cast() {
  if (state !== 'idle') return;
  state = 'casting';
  actionBtn.disabled = true;
  initAudio();
  sounds.cast();

  const gameRect = gameEl.getBoundingClientRect();
  const castDistance = 150 + Math.random() * 150;
  const bobberX = gameRect.width / 2 + (Math.random() - 0.5) * 100;

  rodEl.style.transform = 'translateX(20px) rotate(-15deg)';
  setTimeout(() => { rodEl.style.transform = 'translateX(20px) rotate(30deg)'; }, 200);

  lineEl.style.height = castDistance + 'px';
  bobberEl.style.display = 'block';
  bobberEl.style.left = bobberX + 'px';
  bobberEl.style.top = (gameRect.height * 0.45 + castDistance) + 'px';

  setTimeout(() => {
    state = 'waiting';
    actionBtn.textContent = 'Ждём...';
    const waitTime = 1000 + Math.random() * 4000;
    biteTimeout = setTimeout(startBite, waitTime);
  }, 300);
}

// ==================== ПОКЛЁВКА ====================
function startBite() {
  if (state !== 'waiting') return;
  state = 'biting';
  currentFish = pickFish();
  actionBtn.disabled = false;
  actionBtn.textContent = 'ПОДСЕЧКА!';
  sounds.bite();

  let bob = 0;
  const bobAnim = setInterval(() => {
    if (state !== 'biting') { clearInterval(bobAnim); return; }
    bobberEl.style.transform = `translate(-50%, ${bob % 2 ? -8 : 0}px)`;
    bob++;
  }, 100);

  spawnFish(currentFish);

  const windowTime = 1200 - currentFish.difficulty * 150;
  biteTimeout = setTimeout(() => {
    clearInterval(bobAnim);
    if (state === 'biting') {
      stats.missed++;
      state = 'idle';
      actionBtn.disabled = false;
      actionBtn.textContent = 'Забросить';
      bobberEl.style.display = 'none';
      lineEl.style.height = '0px';
      showCatch('Упустил!', currentFish.key, '#E74C3C');
      clearFish();
    }
  }, Math.max(400, windowTime));
}

let fishEl = null;
function spawnFish(fish) {
  clearFish();
  fishEl = document.createElement('div');
  fishEl.className = 'fish';
  fishEl.innerHTML = fishSVG(fish.key, 60);
  const bobberRect = bobberEl.getBoundingClientRect();
  const gameRect = gameEl.getBoundingClientRect();
  fishEl.style.left = (bobberRect.left - gameRect.left - 30) + 'px';
  fishEl.style.top = (bobberRect.top - gameRect.top + 10) + 'px';
  gameEl.appendChild(fishEl);
}

function clearFish() {
  if (fishEl) { fishEl.remove(); fishEl = null; }
}

// ==================== ПОДСЕЧКА ====================
function hook() {
  if (state !== 'biting') return;
  state = 'fighting';
  actionBtn.disabled = true;
  actionBtn.textContent = 'Тяни!';
  clearTimeout(biteTimeout);
  clearFish();
  sounds.hook();
  showSplash();

  tension = 0;
  tensionDirection = 1;
  const zoneWidth = 14 - currentFish.difficulty * 2.5;
  perfectZone = { start: 50 - zoneWidth, end: 50 + zoneWidth };

  tensionBar.style.display = 'block';
  tensionFill.style.width = '0%';
  perfectZoneEl.style.display = 'block';
  perfectZoneEl.style.left = perfectZone.start + '%';
  perfectZoneEl.style.width = (perfectZone.end - perfectZone.start) + '%';

  tensionInterval = setInterval(() => {
    tension += tensionDirection * (1 + currentFish.difficulty * 0.8);
    if (tension >= 100) { tension = 100; tensionDirection = -1; }
    if (tension <= 0) { tension = 0; tensionDirection = 1; }
    tensionFill.style.width = tension + '%';
  }, 20);

  actionBtn.textContent = 'СТОП!';
  actionBtn.disabled = false;
  actionBtn.onclick = releaseTension;
}

function releaseTension() {
  if (state !== 'fighting') return;
  clearInterval(tensionInterval);
  tensionBar.style.display = 'none';
  perfectZoneEl.style.display = 'none';
  actionBtn.onclick = mainAction;

  const inZone = tension >= perfectZone.start && tension <= perfectZone.end;
  const isBoot = currentFish.key === 'boot';

  if (inZone) {
    if (isBoot) {
      stats.boots++;
      score -= 1;
      if (score < 0) score = 0;
      showCatch(`${currentFish.name} −1`, currentFish.key, '#E74C3C');
      sounds.miss();
    } else {
      score += currentFish.points;
      stats.points += currentFish.points;
      showCatch(`+${currentFish.points} ${currentFish.name}!`, currentFish.key, '#27AE60');
      sounds.catch();
      animateReel();
    }
  } else {
    stats.missed++;
    showCatch('Сорвалась!', currentFish.key, '#E74C3C');
    sounds.miss();
  }

  updateHUD();
  setTimeout(reset, 500);
}

function animateReel() {
  if (fishEl) {
    fishEl.classList.add('reeling');
    sounds.reel();
  }
}

function reset() {
  state = 'idle';
  actionBtn.disabled = false;
  actionBtn.textContent = 'Забросить';
  bobberEl.style.display = 'none';
  lineEl.style.height = '0px';
  clearFish();
  currentFish = null;
}

function mainAction() {
  if (state === 'idle') cast();
  else if (state === 'biting') hook();
}

actionBtn.onclick = mainAction;

// ==================== ТАЙМЕР И ЗАВЕРШЕНИЕ ====================
function startGame() {
  score = 0;
  timeLeft = 60;
  stats = { points: 0, missed: 0, boots: 0 };
  updateHUD();
  gameoverEl.classList.remove('show');
  reset();

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    updateHUD();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      endGame();
    }
  }, 1000);
}

function endGame() {
  state = 'idle';
  clearTimeout(biteTimeout);
  clearInterval(tensionInterval);
  tensionBar.style.display = 'none';
  perfectZoneEl.style.display = 'none';
  bobberEl.style.display = 'none';
  lineEl.style.height = '0px';
  actionBtn.disabled = true;
  clearFish();
  sounds.gameover();

  const isRecord = score > bestScore;
  if (isRecord) {
    bestScore = score;
    localStorage.setItem('fishing_best', bestScore);
  }

  finalScoreEl.textContent = score;
  recordLineEl.textContent = isRecord && score > 0 ? '🏆 Новый рекорд!' : '';
  statPointsEl.textContent = stats.points;
  statMissedEl.textContent = stats.missed;
  statBootsEl.textContent = stats.boots;
  statBestEl.textContent = bestScore;

  gameoverEl.classList.add('show');
}

restartBtn.onclick = startGame;

// ==================== ЗВУК ВКЛ/ВЫКЛ ====================
muteBtn.onclick = () => {
  muted = !muted;
  soundOn.style.display = muted ? 'none' : 'block';
  soundOff.style.display = muted ? 'block' : 'none';
  if (!muted) initAudio();
};

// ==================== СТАРТ ====================
updateHUD();
startGame();
</script>
</body>
</html>
