<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Рыбалка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0a1929;
    overflow: hidden;
    user-select: none;
    touch-action: manipulation;
  }
  body { display: flex; justify-content: center; align-items: center; }

  #game {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    max-height: 900px;
    position: relative;
    background: linear-gradient(180deg, #7EC8E3 0%, #A9D9EC 40%, #5DADE2 55%, #1B4F72 100%);
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }

  /* СОЛНЦЕ */
  .sun {
    position: absolute;
    top: 20px; right: 20px;
    width: 70px; height: 70px;
  }
  .sun svg {
    width: 100%; height: 100%;
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%,100% { filter: drop-shadow(0 0 15px #FFD54F); }
    50% { filter: drop-shadow(0 0 28px #FFEB3B); }
  }

  /* ОБЛАКА */
  .cloud {
    position: absolute;
    opacity: 0.9;
    animation: cloudMove 30s linear infinite;
  }
  .cloud.c1 { top: 50px; left: -100px; width: 90px; animation-duration: 40s; }
  .cloud.c2 { top: 130px; left: -100px; width: 60px; animation-duration: 55s; animation-delay: -20s; }
  @keyframes cloudMove {
    0% { transform: translateX(0); }
    100% { transform: translateX(600px); }
  }

  /* БЕРЕГ */
  .shore {
    position: absolute;
    bottom: 42%;
    left: 0; right: 0;
    height: 60px;
    background: linear-gradient(180deg, #8B6F47 0%, #6B5437 60%, #4A3A26 100%);
    border-top: 4px solid #A08252;
    z-index: 1;
  }
  .shore::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 0; right: 0;
    height: 12px;
    background: repeating-linear-gradient(90deg,
      transparent 0px, transparent 25px,
      rgba(255,255,255,0.25) 25px, rgba(255,255,255,0.25) 45px);
    border-radius: 50%;
    animation: wave 3s linear infinite;
  }
  @keyframes wave {
    0% { transform: translateX(0); }
    100% { transform: translateX(45px); }
  }

  /* ВОДА */
  .water {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 42%;
    background: linear-gradient(180deg, #2874A6 0%, #154360 100%);
    z-index: 0;
  }

  /* РЫБАК */
  .fisher {
    position: absolute;
    bottom: calc(42% + 30px);
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 100px;
    z-index: 3;
    transition: transform 0.15s;
  }
  .fisher svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35));
  }
  .fisher.casting { transform: translateX(-50%) rotate(-4deg); }

  /* ЛЕСКА */
  #line {
    position: absolute;
    width: 2px;
    background: rgba(255,255,255,0.85);
    transform-origin: top center;
    transition: height 0.15s linear;
    z-index: 5;
    display: none;
  }

  /* ПОПЛАВОК */
  #bobber {
    position: absolute;
    width: 16px;
    height: 34px;
    transform: translate(-50%, 0);
    z-index: 6;
    display: none;
  }
  #bobber svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
  }
  #bobber.biting svg {
    animation: bobberBite 0.25s ease-in-out infinite;
  }
  @keyframes bobberBite {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(7px); }
  }
</style>
</head>
<body>
<div id="game">
 <style>
  /* РЫБА */
  .fish {
    position: absolute;
    width: 60px;
    height: 44px;
    transition: opacity 0.4s;
    pointer-events: none;
    z-index: 4;
    animation: fishSwim 2s ease-in-out infinite;
  }
  @keyframes fishSwim {
    0%,100% { transform: translateX(0); }
    50% { transform: translateX(-8px); }
  }
  .fish.reeling {
    animation: reel 0.7s ease-out forwards;
  }
  @keyframes reel {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(-60px, -280px) rotate(-40deg); opacity: 0; }
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    z-index: 20;
  }
  .hud-item {
    background: rgba(0,0,0,0.4);
    padding: 6px 14px;
    border-radius: 20px;
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid rgba(255,255,255,0.15);
    color: white;
    font-weight: bold;
    font-size: 16px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }
  .hud-item svg { width: 20px; height: 20px; }

  /* КНОПКА ДЕЙСТВИЯ */
  #actionBtn {
    position: absolute;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 50px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    background: linear-gradient(180deg, #F39C12, #E67E22);
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 0 #A04000, 0 8px 20px rgba(0,0,0,0.4);
    transition: all 0.1s;
    z-index: 20;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-family: inherit;
    min-width: 200px;
  }
  #actionBtn:active:not(:disabled) {
    transform: translateX(-50%) translateY(3px);
    box-shadow: 0 2px 0 #A04000, 0 4px 10px rgba(0,0,0,0.4);
  }
  #actionBtn:disabled {
    background: #7F8C8D;
    box-shadow: 0 5px 0 #566573;
    cursor: not-allowed;
  }
  #actionBtn.hidden { display: none; }

  /* УВЕДОМЛЕНИЕ */
  #catch {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(255,255,255,0.97);
    padding: 14px 26px;
    border-radius: 18px;
    font-size: 20px;
    font-weight: bold;
    color: #E67E22;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    z-index: 30;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
  }
  #catch.show { transform: translate(-50%, -50%) scale(1); }
  #catch svg { width: 38px; height: 28px; flex-shrink: 0; }

  /* ШКАЛА НАТЯЖЕНИЯ */
  #tensionBar {
    position: absolute;
    bottom: calc(95px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 26px;
    background: rgba(0,0,0,0.6);
    border-radius: 13px;
    overflow: hidden;
    display: none;
    z-index: 20;
    border: 2px solid rgba(255,255,255,0.8);
  }
  #tensionFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2ECC71, #F39C12, #E74C3C);
    transition: width 0.03s linear;
  }
  #perfectZone {
    position: absolute;
    top: 0; bottom: 0;
    background: rgba(255,255,255,0.4);
    border-left: 2px solid #FFF;
    border-right: 2px solid #FFF;
    pointer-events: none;
    display: none;
    box-shadow: inset 0 0 12px rgba(255,255,255,0.5);
  }

  /* ВСПЛЕСК */
  #splash {
    position: absolute;
    pointer-events: none;
    z-index: 8;
    display: none;
    transform: translate(-50%, -50%);
  }
  #splash.active {
    display: block;
    animation: splash 0.7s ease-out forwards;
  }
  @keyframes splash {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
  }
 </style>
 <style>
  /* ЭКРАНЫ */
  .screen {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: none;
    flex-direction: column;
    background: linear-gradient(180deg, #1B4F72 0%, #0a1929 100%);
    color: white;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
  }
  .screen.show { display: flex; }
  .screen-title {
    font-size: 34px;
    text-align: center;
    font-weight: 900;
    letter-spacing: 3px;
    color: #FFD700;
    text-shadow: 0 3px 0 #B8860B, 0 6px 20px rgba(0,0,0,0.6);
    margin: 20px 0;
  }
  .screen-sub {
    text-align: center;
    font-size: 16px;
    opacity: 0.8;
    margin-bottom: 24px;
  }
  .menu-btn {
    padding: 16px 30px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 16px;
    color: white;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-family: inherit;
    margin-bottom: 12px;
    transition: transform 0.1s;
    box-shadow: 0 5px 0 rgba(0,0,0,0.4);
    width: 100%;
    max-width: 320px;
    align-self: center;
  }
  .menu-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }
  .menu-btn.play {
    background: linear-gradient(180deg, #2ECC71, #27AE60);
    box-shadow: 0 5px 0 #1E8449;
  }
  .menu-btn.shop {
    background: linear-gradient(180deg, #F39C12, #E67E22);
    box-shadow: 0 5px 0 #A04000;
  }
  .menu-btn.back {
    background: linear-gradient(180deg, #7F8C8D, #566573);
    box-shadow: 0 5px 0 #2C3E50;
  }

  /* МАГАЗИН */
  .shop-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .coins {
    background: rgba(255,215,0,0.15);
    border: 2px solid #FFD700;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 18px;
    color: #FFD700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .coins svg { width: 22px; height: 22px; }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    background: rgba(0,0,0,0.3);
    padding: 4px;
    border-radius: 12px;
  }
  .tab {
    flex: 1;
    padding: 10px 4px;
    border: none;
    background: transparent;
    color: white;
    font-weight: bold;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    opacity: 0.6;
  }
  .tab.active {
    background: linear-gradient(180deg, #F39C12, #E67E22);
    opacity: 1;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .shop-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 20px;
  }
  .shop-item {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s;
  }
  .shop-item.owned {
    border-color: #FFD700;
    background: rgba(255,215,0,0.08);
  }
  .item-icon {
    width: 50px;
    height: 50px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
  }
  .item-icon svg { width: 42px; height: 42px; }
  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 3px;
  }
  .item-desc {
    font-size: 12px;
    opacity: 0.7;
    line-height: 1.3;
  }
  .item-btn {
    padding: 8px 14px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 13px;
    color: white;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: transform 0.1s;
    flex-shrink: 0;
  }
  .item-btn.buy {
    background: linear-gradient(180deg, #2ECC71, #27AE60);
    box-shadow: 0 3px 0 #1E8449;
  }
  .item-btn.equip {
    background: linear-gradient(180deg, #3498DB, #2980B9);
    box-shadow: 0 3px 0 #1A5276;
  }
  .item-btn.equipped {
    background: #566573;
    cursor: default;
    box-shadow: none;
  }
  .item-btn:active:not(.equipped) { transform: translateY(2px); }
  .item-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ГЕЙМ ОВЕР */
  #gameover .screen-title {
    color: #E74C3C;
    text-shadow: 0 3px 0 #922B21;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 15px;
  }
  .stat-row span:last-child {
    font-weight: bold;
    color: #FFD700;
  }
  .toast {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0,0,0,0.85);
    color: white;
    padding: 12px 22px;
    border-radius: 24px;
    font-weight: bold;
    font-size: 15px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    border: 2px solid #FFD700;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div id="game">
 <!-- ФОН -->
<div class="sun">
  <svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="24" fill="#FFD54F"/>
    <circle cx="50" cy="50" r="24" fill="none" stroke="#FFB300" stroke-width="2"/>
    <g stroke="#FFD54F" stroke-width="4" stroke-linecap="round">
      <line x1="50" y1="10" x2="50" y2="20"/>
      <line x1="50" y1="80" x2="50" y2="90"/>
      <line x1="10" y1="50" x2="20" y2="50"/>
      <line x1="80" y1="50" x2="90" y2="50"/>
      <line x1="22" y1="22" x2="29" y2="29"/>
      <line x1="71" y1="71" x2="78" y2="78"/>
      <line x1="78" y1="22" x2="71" y2="29"/>
      <line x1="29" y1="71" x2="22" y2="78"/>
    </g>
  </svg>
</div>

<div class="cloud c1">
  <svg viewBox="0 0 100 40">
    <ellipse cx="30" cy="25" rx="25" ry="14" fill="#fff"/>
    <ellipse cx="55" cy="20" rx="22" ry="16" fill="#fff"/>
    <ellipse cx="75" cy="27" rx="20" ry="12" fill="#fff"/>
  </svg>
</div>
<div class="cloud c2">
  <svg viewBox="0 0 100 40">
    <ellipse cx="30" cy="25" rx="25" ry="14" fill="#fff" opacity="0.85"/>
    <ellipse cx="55" cy="20" rx="22" ry="16" fill="#fff" opacity="0.85"/>
    <ellipse cx="75" cy="27" rx="20" ry="12" fill="#fff" opacity="0.85"/>
  </svg>
</div>

<div class="water"></div>
<div class="shore"></div>

<!-- РЫБАК -->
<div class="fisher" id="fisher">
  <svg viewBox="0 0 90 100">
    <line x1="58" y1="45" x2="82" y2="5" stroke="#5D3A1A" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="82" y1="5" x2="85" y2="2" stroke="#2C1810" stroke-width="2" stroke-linecap="round"/>
    <rect x="36" y="78" width="6" height="18" rx="3" fill="#34495E"/>
    <rect x="48" y="78" width="6" height="18" rx="3" fill="#34495E"/>
    <ellipse cx="39" cy="96" rx="6" ry="3" fill="#1C2833"/>
    <ellipse cx="51" cy="96" rx="6" ry="3" fill="#1C2833"/>
    <path d="M32 50 Q32 40 45 40 Q58 40 58 50 L58 80 Q58 84 54 84 L36 84 Q32 84 32 80 Z" fill="#E67E22"/>
    <path d="M32 50 Q32 40 45 40 Q58 40 58 50 L58 80 Q58 84 54 84 L36 84 Q32 84 32 80 Z" fill="none" stroke="#A04000" stroke-width="1.5"/>
    <rect x="36" y="58" width="8" height="9" rx="1.5" fill="#A04000"/>
    <rect x="46" y="58" width="8" height="9" rx="1.5" fill="#A04000"/>
    <path d="M33 52 Q25 60 28 72" stroke="#F5CBA7" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M57 52 Q65 50 62 45" stroke="#F5CBA7" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="45" cy="28" r="15" fill="#F5CBA7"/>
    <ellipse cx="45" cy="18" rx="24" ry="5" fill="#6B4226"/>
    <path d="M32 18 Q32 4 45 4 Q58 4 58 18 Z" fill="#8B5A2B"/>
    <path d="M32 18 Q32 4 45 4 Q58 4 58 18 Z" fill="none" stroke="#4A2C17" stroke-width="1.2"/>
    <ellipse cx="45" cy="18" rx="24" ry="5" fill="none" stroke="#4A2C17" stroke-width="1.2"/>
    <circle cx="40" cy="28" r="1.8" fill="#2C3E50"/>
    <circle cx="50" cy="28" r="1.8" fill="#2C3E50"/>
    <path d="M40 34 Q45 37 50 34" stroke="#2C3E50" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="44" r="4" fill="#F5CBA7"/>
  </svg>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-item">
    <svg viewBox="0 0 40 30">
      <path d="M5 15 Q15 3 30 15 Q15 27 5 15 Z" fill="#4FC3F7" stroke="#0277BD" stroke-width="1.5"/>
      <path d="M30 15 L38 8 L38 22 Z" fill="#4FC3F7" stroke="#0277BD" stroke-width="1.5"/>
      <circle cx="14" cy="13" r="2" fill="#0D47A1"/>
    </svg>
    <span id="scoreText">0</span>
  </div>
  <div class="hud-item">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
      <text x="12" y="17" font-size="11" font-weight="bold" fill="#8B6914" text-anchor="middle" font-family="Arial">₽</text>
    </svg>
    <span id="coinsText">0</span>
  </div>
  <div class="hud-item">
    <svg viewBox="0 0 30 30">
      <circle cx="15" cy="15" r="11" fill="none" stroke="#fff" stroke-width="2.5"/>
      <line x1="15" y1="15" x2="15" y2="9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="15" y1="15" x2="20" y2="17" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <span id="timeText">60</span>
  </div>
</div>

<!-- ЛЕСКА И ПОПЛАВОК -->
<div id="line"></div>
<div id="bobber">
  <svg viewBox="0 0 16 34">
    <line x1="8" y1="0" x2="8" y2="8" stroke="#FFEB3B" stroke-width="2"/>
    <path d="M3 15 A5 7 0 0 1 13 15 L13 20 L3 20 Z" fill="#E74C3C"/>
    <path d="M3 20 L13 20 L13 24 A5 7 0 0 1 3 24 Z" fill="#FFFFFF"/>
    <line x1="8" y1="27" x2="8" y2="34" stroke="#333" stroke-width="2"/>
    <circle cx="8" cy="20" r="5" fill="none" stroke="#333" stroke-width="1.2" opacity="0.5"/>
  </svg>
</div>

<!-- ВСПЛЕСК -->
<div id="splash">
  <svg viewBox="0 0 100 60" width="110">
    <ellipse cx="50" cy="45" rx="42" ry="9" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
    <ellipse cx="50" cy="45" rx="26" ry="6" fill="none" stroke="#fff" stroke-width="2" opacity="0.7"/>
    <circle cx="22" cy="25" r="4" fill="#fff" opacity="0.9"/>
    <circle cx="78" cy="22" r="5" fill="#fff" opacity="0.9"/>
    <circle cx="50" cy="12" r="3.5" fill="#fff" opacity="0.85"/>
  </svg>
</div>

<!-- ШКАЛА НАТЯЖЕНИЯ -->
<div id="tensionBar">
  <div id="perfectZone"></div>
  <div id="tensionFill"></div>
</div>

<button id="actionBtn">Забросить</button>
<div id="catch"></div>
<div class="toast" id="toast"></div>
  <!-- ГЛАВНОЕ МЕНЮ -->
  <div class="screen show" id="mainMenu">
    <div class="screen-title">РЫБАЛКА</div>
    <div class="screen-sub">Поймай как можно больше рыбы за 60 секунд</div>
    <div class="coins" style="align-self:center;margin-bottom:24px;">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
        <text x="12" y="17" font-size="11" font-weight="bold" fill="#8B6914" text-anchor="middle" font-family="Arial">₽</text>
      </svg>
      <span id="menuCoins">0</span>
    </div>

<script>
// ==================== SVG ИКОНКИ ====================
function fishSVG(type, size = 60) {
  const svgs = {
    perch: `<svg viewBox="0 0 60 44" width="${size}">
      <path d="M5 22 Q22 4 42 22 Q22 40 5 22 Z" fill="#7CB342" stroke="#33691E" stroke-width="1.5"/>
      <path d="M42 22 L56 12 L56 32 Z" fill="#7CB342" stroke="#33691E" stroke-width="1.5"/>
      <path d="M15 15 L20 29 M22 12 L27 32 M29 12 L34 32" stroke="#33691E" stroke-width="1.5" fill="none"/>
      <circle cx="14" cy="19" r="2.5" fill="#1B5E20"/>
      <circle cx="14" cy="19" r="1" fill="#000"/>
    </svg>`,
    carp: `<svg viewBox="0 0 60 44" width="${size}">
      <path d="M5 22 Q22 6 42 22 Q22 38 5 22 Z" fill="#FFB300" stroke="#E65100" stroke-width="1.5"/>
      <path d="M42 22 L56 10 L58 22 L56 34 Z" fill="#FF8F00" stroke="#E65100" stroke-width="1.5"/>
      <circle cx="14" cy="19" r="2.8" fill="#FFF"/>
      <circle cx="14" cy="19" r="1.5" fill="#000"/>
      <path d="M10 26 Q14 29 18 26" stroke="#E65100" stroke-width="1.2" fill="none"/>
    </svg>`,
    ruffe: `<svg viewBox="0 0 60 44" width="${size}">
      <path d="M5 22 Q22 8 42 22 Q22 36 5 22 Z" fill="#8D6E63" stroke="#3E2723" stroke-width="1.5"/>
      <path d="M42 22 L56 12 L56 32 Z" fill="#8D6E63" stroke="#3E2723" stroke-width="1.5"/>
      <path d="M12 8 L16 14 M20 6 L23 13 M28 6 L30 13 M36 8 L37 14" stroke="#3E2723" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <circle cx="14" cy="19" r="2.5" fill="#FFEB3B"/>
      <circle cx="14" cy="19" r="1.3" fill="#000"/>
    </svg>`,
    pike: `<svg viewBox="0 0 70 44" width="${size}">
      <path d="M5 22 Q25 6 50 20 L58 18 L54 22 L58 26 L50 24 Q25 38 5 22 Z" fill="#558B2F" stroke="#1B5E20" stroke-width="1.5"/>
      <path d="M50 20 L68 10 L66 22 L68 34 L50 24 Z" fill="#33691E" stroke="#1B5E20" stroke-width="1.5"/>
      <path d="M15 18 L18 26 M22 15 L25 29 M29 14 L32 30" stroke="#1B5E20" stroke-width="1.2" fill="none"/>
      <circle cx="13" cy="19" r="3" fill="#F44336"/>
      <circle cx="13" cy="19" r="1.5" fill="#000"/>
    </svg>`,
    catfish: `<svg viewBox="0 0 80 50" width="${size + 10}">
      <path d="M8 25 Q30 5 55 25 Q30 45 8 25 Z" fill="#455A64" stroke="#1A237E" stroke-width="1.8"/>
      <path d="M55 25 L74 12 L74 38 Z" fill="#37474F" stroke="#1A237E" stroke-width="1.8"/>
      <circle cx="18" cy="22" r="3.2" fill="#FFF"/>
      <circle cx="18" cy="22" r="1.7" fill="#000"/>
      <path d="M8 25 Q2 22 -2 24 M8 25 Q2 28 -2 26" stroke="#1A237E" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>`,
    boot: `<svg viewBox="0 0 60 50" width="${size}">
      <path d="M15 8 L15 30 Q15 38 8 40 L55 40 Q52 34 45 32 L40 30 L40 8 Z" fill="#5D4037" stroke="#3E2723" stroke-width="2"/>
      <path d="M15 8 L40 8" stroke="#3E2723" stroke-width="2"/>
      <path d="M15 35 L55 35" stroke="#3E2723" stroke-width="1.5"/>
    </svg>`
  };
  return svgs[type] || svgs.perch;
}

// ==================== ЗВУКИ ====================
let audioCtx = null;
let muted = false;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
}

function playTone(freq, duration, type = 'sine', volume = 0.15, slideTo = null) {
  if (muted || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

const sounds = {
  cast: () => playTone(600, 0.2, 'sine', 0.12, 200),
  bite: () => { playTone(800, 0.1, 'square', 0.1); setTimeout(() => playTone(1000, 0.1, 'square', 0.1), 100); },
  hook: () => playTone(400, 0.15, 'triangle', 0.2, 900),
  catch: () => { playTone(523, 0.1, 'sine', 0.15); setTimeout(() => playTone(659, 0.1, 'sine', 0.15), 100); setTimeout(() => playTone(784, 0.2, 'sine', 0.15), 200); },
  miss: () => playTone(300, 0.3, 'sawtooth', 0.1, 100),
  reel: () => playTone(200, 0.4, 'sawtooth', 0.08, 500),
  coin: () => { playTone(1200, 0.08, 'sine', 0.15); setTimeout(() => playTone(1600, 0.12, 'sine', 0.15), 80); },
  gameover: () => { playTone(400, 0.2, 'sine', 0.15); setTimeout(() => playTone(300, 0.2, 'sine', 0.15), 200); setTimeout(() => playTone(200, 0.4, 'sine', 0.15), 400); }
};

// ==================== МАГАЗИН ДАННЫЕ ====================
const SHOP_ITEMS = {
  rods: [
    { id: 'rod_basic',  name: 'Бамбуковая удочка', desc: 'Стандартная. Без бонусов', price: 0,    bonus: 0 },
    { id: 'rod_fiber',  name: 'Стеклопластик',     desc: 'Больше монет. +15%',        price: 100,  bonus: 0.15 },
    { id: 'rod_carbon', name: 'Карбоновая',        desc: 'Профессионал. +35%',        price: 350,  bonus: 0.35 },
    { id: 'rod_gold',   name: 'Золотая удочка',    desc: 'Легенда! +70% монет',       price: 1000, bonus: 0.70 }
  ],
  baits: [
    { id: 'bait_worm',   name: 'Червь',            desc: 'Обычная наживка',           price: 0,   effect: 'none',     value: 0 },
    { id: 'bait_maggot', name: 'Опарыш',           desc: 'Мелочь клюёт чаще',         price: 80,  effect: 'small',    value: 0.3 },
    { id: 'bait_lure',   name: 'Блесна',           desc: 'Хищник клюёт чаще',         price: 250, effect: 'predator', value: 0.3 },
    { id: 'bait_golden', name: 'Золотая приманка', desc: 'Редкая рыба! +50% очков',   price: 600, effect: 'rare',     value: 0.5 }
  ],
  gear: [
    { id: 'gear_none',   name: 'Без снастей',   desc: 'Обычное время игры',      price: 0,   bonus: 0 },
    { id: 'gear_basket', name: 'Сак',           desc: '+15 секунд к таймеру',    price: 150, bonus: 15 },
    { id: 'gear_sonar',  name: 'Эхолот',        desc: 'Шире зона подсечки',      price: 400, bonus: 0.5 },
    { id: 'gear_both',   name: 'Полный набор',  desc: '+20 сек и широкая зона',  price: 900, bonus: 'both' }
  ]
};

// ==================== СОХРАНЕНИЕ ====================
const SAVE_KEY = 'fishing_save_v2';
let save = loadSave();

function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    return {
      coins: s.coins || 0,
      best: s.best || 0,
      owned: s.owned || { rods: ['rod_basic'], baits: ['bait_worm'], gear: ['gear_none'] },
      equipped: s.equipped || { rods: 'rod_basic', baits: 'bait_worm', gear: 'gear_none' }
    };
  } catch(e) {
    return {
      coins: 0, best: 0,
      owned: { rods: ['rod_basic'], baits: ['bait_worm'], gear: ['gear_none'] },
      equipped: { rods: 'rod_basic', baits: 'bait_worm', gear: 'gear_none' }
    };
  }
}

function persistSave() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(save));
}
         </script>
         <script>
// ==================== DOM ====================
const $ = id => document.getElementById(id);
const gameEl = $('game');
const actionBtn = $('actionBtn');
const lineEl = $('line');
const bobberEl = $('bobber');
const fisherEl = $('fisher');
const scoreTextEl = $('scoreText');
const timeTextEl = $('timeText');
const coinsTextEl = $('coinsText');
const catchEl = $('catch');
const gameoverEl = $('gameover');
const finalScoreEl = $('finalScore');
const rewardLineEl = $('rewardLine');
const restartBtn = $('restartBtn');
const tensionBar = $('tensionBar');
const tensionFill = $('tensionFill');
const perfectZoneEl = $('perfectZone');
const splashEl = $('splash');
const statPointsEl = $('statPoints');
const statMissedEl = $('statMissed');
const statBootsEl = $('statBoots');
const statBestEl = $('statBest');
const mainMenu = $('mainMenu');
const shopScreen = $('shopScreen');
const shopListEl = $('shopList');
const menuCoinsEl = $('menuCoins');
const menuBestEl = $('menuBest');
const shopCoinsEl = $('shopCoins');
const toastEl = $('toast');

// ==================== СОСТОЯНИЕ ====================
let state = 'idle';
let score = 0;
let coinsEarned = 0;
let timeLeft = 60;
let gameDuration = 60;
let timerInterval = null;
let biteTimeout = null;
let currentFish = null;
let tension = 0;
let tensionDirection = 1;
let tensionInterval = null;
let perfectZone = null;
let stats = { points: 0, missed: 0, boots: 0 };
let fishEl = null;
let currentTab = 'rods';

// ==================== ХЕЛПЕРЫ ====================
function getEquipped() {
  return {
    rod: SHOP_ITEMS.rods.find(r => r.id === save.equipped.rods) || SHOP_ITEMS.rods[0],
    bait: SHOP_ITEMS.baits.find(b => b.id === save.equipped.baits) || SHOP_ITEMS.baits[0],
    gear: SHOP_ITEMS.gear.find(g => g.id === save.equipped.gear) || SHOP_ITEMS.gear[0]
  };
}

function updateHUD() {
  scoreTextEl.textContent = score;
  timeTextEl.textContent = timeLeft;
  coinsTextEl.textContent = save.coins;
}

function updateMenu() {
  menuCoinsEl.textContent = save.coins;
  menuBestEl.textContent = save.best;
  shopCoinsEl.textContent = save.coins;
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1600);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  if (id) $(id).classList.add('show');
}

// ==================== РЫБА ====================
const BASE_FISH = [
  { key: 'perch',   name: 'Окунь',          points: 1,  chance: 40, difficulty: 1,   biteMin: 2000, biteMax: 4000 },
  { key: 'carp',    name: 'Карась',         points: 2,  chance: 25, difficulty: 1.5, biteMin: 2200, biteMax: 4200 },
  { key: 'ruffe',   name: 'Ёрш',            points: 3,  chance: 15, difficulty: 2,   biteMin: 2400, biteMax: 4500 },
  { key: 'pike',    name: 'Щука',           points: 5,  chance: 12, difficulty: 2.5, biteMin: 2600, biteMax: 4800 },
  { key: 'catfish', name: 'Сом-гигант',     points: 10, chance: 5,  difficulty: 3,   biteMin: 3000, biteMax: 5500 },
  { key: 'boot',    name: 'Старый ботинок', points: -1, chance: 3,  difficulty: 1,   biteMin: 2000, biteMax: 3500 }
];

function pickFish() {
  const bait = getEquipped().bait;
  const weighted = BASE_FISH.map(f => {
    let w = f.chance;
    if (bait.effect === 'small' && (f.key === 'perch' || f.key === 'carp' || f.key === 'ruffe')) w *= 1 + bait.value;
    if (bait.effect === 'predator' && (f.key === 'pike' || f.key === 'catfish')) w *= 1 + bait.value;
    if (bait.effect === 'rare' && f.points >= 3 && f.key !== 'boot') w *= 1 + bait.value;
    if (f.key === 'boot' && bait.effect === 'rare') w *= 0.3;
    return { ...f, w };
  });
  const total = weighted.reduce((s, f) => s + f.w, 0);
  let r = Math.random() * total;
  for (const f of weighted) {
    r -= f.w;
    if (r <= 0) return f;
  }
  return weighted[0];
}

// ==================== ИГРА ====================
function startGame() {
  const gear = getEquipped().gear;
  let duration = 60;
  if (gear.bonus === 15) duration += 15;
  if (gear.bonus === 'both') duration += 20;
  gameDuration = duration;
  timeLeft = duration;
  score = 0;
  coinsEarned = 0;
  stats = { points: 0, missed: 0, boots: 0 };
  updateHUD();
  showScreen(null);
  actionBtn.classList.remove('hidden');
  resetRod();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    updateHUD();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      endGame();
    }
  }, 1000);
}

function cast() {
  if (state !== 'idle') return;
  state = 'casting';
  actionBtn.disabled = true;
  initAudio();
  sounds.cast();
  fisherEl.classList.add('casting');
  setTimeout(() => fisherEl.classList.remove('casting'), 250);

  const gameRect = gameEl.getBoundingClientRect();
  const fisherRect = fisherEl.getBoundingClientRect();
  const lineStartX = fisherRect.left - gameRect.left + fisherRect.width * 0.93;
  const lineStartY = fisherRect.top - gameRect.top + fisherRect.height * 0.05;

  const castDistance = 160 + Math.random() * 140;
  const bobberX = lineStartX + 40 + Math.random() * 80;
  const bobberY = lineStartY + castDistance;

  lineEl.style.display = 'block';
  lineEl.style.left = lineStartX + 'px';
  lineEl.style.top = lineStartY + 'px';
  lineEl.style.height = '0px';
  setTimeout(() => { lineEl.style.height = castDistance + 'px'; }, 20);

  bobberEl.style.display = 'block';
  bobberEl.style.left = bobberX + 'px';
  bobberEl.style.top = bobberY + 'px';

  setTimeout(() => {
    state = 'waiting';
    actionBtn.textContent = 'Ждём...';
    const waitTime = 800 + Math.random() * 3500;
    biteTimeout = setTimeout(startBite, waitTime);
  }, 350);
}

function startBite() {
  if (state !== 'waiting') return;
  state = 'biting';
  currentFish = pickFish();
  actionBtn.disabled = false;
  actionBtn.textContent = 'ПОДСЕЧКА!';
  sounds.bite();
  bobberEl.classList.add('biting');
  spawnFish(currentFish);

  const biteWindow = currentFish.biteMin + Math.random() * (currentFish.biteMax - currentFish.biteMin);
  biteTimeout = setTimeout(() => {
    if (state === 'biting') {
      bobberEl.classList.remove('biting');
      stats.missed++;
      state = 'idle';
      actionBtn.disabled = false;
      actionBtn.textContent = 'Забросить';
      bobberEl.style.display = 'none';
      lineEl.style.height = '0px';
      lineEl.style.display = 'none';
      showCatch('Упустил!', currentFish.key, '#E74C3C');
      clearFish();
    }
  }, biteWindow);
}

function spawnFish(fish) {
  clearFish();
  fishEl = document.createElement('div');
  fishEl.className = 'fish';
  fishEl.innerHTML = fishSVG(fish.key, 60);
  const bobberRect = bobberEl.getBoundingClientRect();
  const gameRect = gameEl.getBoundingClientRect();
  fishEl.style.left = (bobberRect.left - gameRect.left - 30) + 'px';
  fishEl.style.top = (bobberRect.top - gameRect.top + 15) + 'px';
  gameEl.appendChild(fishEl);
}

function clearFish() {
  if (fishEl) { fishEl.remove(); fishEl = null; }
}

function hook() {
  if (state !== 'biting') return;
  state = 'fighting';
  actionBtn.disabled = true;
  actionBtn.textContent = 'Тяни!';
  clearTimeout(biteTimeout);
  clearFish();
  bobberEl.classList.remove('biting');
  sounds.hook();
  showSplash();

  tension = 0;
  tensionDirection = 1;
  const gear = getEquipped().gear;
  let zoneWidth = 16 - currentFish.difficulty * 2.5;
  if (gear.bonus === 0.5 || gear.bonus === 'both') zoneWidth *= 1.5;
  perfectZone = { start: 50 - zoneWidth, end: 50 + zoneWidth };

  tensionBar.style.display = 'block';
  tensionFill.style.width = '0%';
  perfectZoneEl.style.display = 'block';
  perfectZoneEl.style.left = perfectZone.start + '%';
  perfectZoneEl.style.width = (perfectZone.end - perfectZone.start) + '%';

  const speed = 0.9 + currentFish.difficulty * 0.7;
  tensionInterval = setInterval(() => {
    tension += tensionDirection * speed;
    if (tension >= 100) { tension = 100; tensionDirection = -1; }
    if (tension <= 0) { tension = 0; tensionDirection = 1; }
    tensionFill.style.width = tension + '%';
  }, 20);

  actionBtn.textContent = 'СТОП!';
  actionBtn.disabled = false;
  actionBtn.onclick = releaseTension;
}

function releaseTension() {
  if (state !== 'fighting') return;
  clearInterval(tensionInterval);
  tensionBar.style.display = 'none';
  perfectZoneEl.style.display = 'none';
  actionBtn.onclick = mainAction;

  const inZone = tension >= perfectZone.start && tension <= perfectZone.end;
  const isBoot = currentFish.key === 'boot';
  const bait = getEquipped().bait;

  if (inZone) {
    if (isBoot) {
      stats.boots++;
      score = Math.max(0, score - 1);
      showCatch(`${currentFish.name}`, currentFish.key, '#E74C3C');
      sounds.miss();
    } else {
      let points = currentFish.points;
      if (bait.effect === 'rare') points = Math.ceil(points * (1 + bait.value));
      score += points;
      stats.points += points;
      showCatch(`+${points} ${currentFish.name}!`, currentFish.key, '#27AE60');
      sounds.catch();
      animateReel();
    }
  } else {
    stats.missed++;
    showCatch('Сорвалась!', currentFish.key, '#E74C3C');
    sounds.miss();
  }

  updateHUD();
  setTimeout(resetRod, 600);
}

function animateReel() {
  if (fishEl) {
    fishEl.classList.add('reeling');
    sounds.reel();
  }
}

function resetRod() {
  state = 'idle';
  actionBtn.disabled = false;
  actionBtn.textContent = 'Забросить';
  bobberEl.style.display = 'none';
  bobberEl.classList.remove('biting');
  lineEl.style.display = 'none';
  lineEl.style.height = '0px';
  clearFish();
  currentFish = null;
}

function mainAction() {
  if (state === 'idle') cast();
  else if (state === 'biting') hook();
}

actionBtn.onclick = mainAction;

function showSplash() {
  const bobberRect = bobberEl.getBoundingClientRect();
  const gameRect = gameEl.getBoundingClientRect();
  splashEl.style.left = (bobberRect.left - gameRect.left + bobberRect.width / 2) + 'px';
  splashEl.style.top = (bobberRect.top - gameRect.top + 20) + 'px';
  splashEl.classList.add('active');
  setTimeout(() => splashEl.classList.remove('active'), 700);
}

function showCatch(text, fishKey, color) {
  catchEl.innerHTML = fishSVG(fishKey, 40) + `<span>${text}</span>`;
  catchEl.style.color = color || '#E67E22';
  catchEl.classList.add('show');
  setTimeout(() => catchEl.classList.remove('show'), 900);
}

function endGame() {
  state = 'idle';
  clearTimeout(biteTimeout);
  clearInterval(tensionInterval);
  tensionBar.style.display = 'none';
  perfectZoneEl.style.display = 'none';
  bobberEl.style.display = 'none';
  lineEl.style.display = 'none';
  actionBtn.classList.add('hidden');
  clearFish();
  sounds.gameover();

  const rod = getEquipped().rod;
  const multiplier = 1 + (rod.bonus || 0);
  coinsEarned = Math.max(0, Math.round(score * 5 * multiplier));
  save.coins += coinsEarned;

  const isRecord = score > save.best;
  if (isRecord) save.best = score;
  persistSave();

  finalScoreEl.textContent = score;
  rewardLineEl.textContent = `+${coinsEarned} монет${isRecord && score > 0 ? '  •  Новый рекорд!' : ''}`;
  statPointsEl.textContent = stats.points;
  statMissedEl.textContent = stats.missed;
  statBootsEl.textContent = stats.boots;
  statBestEl.textContent = save.best;

  if (coinsEarned > 0) setTimeout(() => sounds.coin(), 400);

  showScreen('gameover');
  updateMenu();
}

// ==================== МАГАЗИН UI ====================
function renderShop() {
  const items = SHOP_ITEMS[currentTab];
  const ownedIds = save.owned[currentTab] || [];
  const equippedId = save.equipped[currentTab];

  shopListEl.innerHTML = items.map(item => {
    const owned = ownedIds.includes(item.id);
    const equipped = equippedId === item.id;
    const canAfford = save.coins >= item.price;
    let btn;
    if (equipped) {
      btn = `<button class="item-btn equipped" disabled>Надето</button>`;
    } else if (owned) {
      btn = `<button class="item-btn equip" data-action="equip" data-id="${item.id}">Надеть</button>`;
    } else {
      btn = `<button class="item-btn buy" data-action="buy" data-id="${item.id}" ${canAfford ? '' : 'disabled'}>${item.price} ₽</button>`;
    }

    let icon = '';
    if (currentTab === 'rods') icon = `<svg viewBox="0 0 50 50" width="42" height="42"><line x1="10" y1="42" x2="38" y2="8" stroke="#8B5A2B" stroke-width="3.5" stroke-linecap="round"/><circle cx="38" cy="8" r="3" fill="#5D3A1A"/><path d="M38 10 Q42 22 40 32" stroke="#DDD" stroke-width="1.2" fill="none"/><circle cx="40" cy="34" r="3" fill="#E74C3C"/></svg>`;
    if (currentTab === 'baits') icon = `<svg viewBox="0 0 50 50" width="42" height="42"><circle cx="25" cy="25" r="13" fill="#8B5A2B"/><circle cx="21" cy="22" r="3" fill="#5D3A1A"/><circle cx="28" cy="28" r="2.5" fill="#5D3A1A"/><circle cx="25" cy="18" r="1.5" fill="#A0704A"/></svg>`;
    if (currentTab === 'gear') icon = `<svg viewBox="0 0 50 50" width="42" height="42"><rect x="10" y="20" width="30" height="20" rx="3" fill="#7F8C8D" stroke="#566573" stroke-width="1.5"/><path d="M10 20 L18 12 L32 12 L40 20" fill="#95A5A6" stroke="#566573" stroke-width="1.5"/></svg>`;

    return `
      <div class="shop-item ${owned ? 'owned' : ''}">
        <div class="item-icon">${icon}</div>
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-desc">${item.desc}</div>
        </div>
        ${btn}
      </div>
    `;
  }).join('');

  shopCoinsEl.textContent = save.coins;
}

shopListEl.addEventListener('click', e => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  const item = SHOP_ITEMS[currentTab].find(i => i.id === id);
  if (!item) return;

  if (action === 'buy') {
    if (save.coins < item.price) { showToast('Недостаточно монет'); return; }
    save.coins -= item.price;
    save.owned[currentTab].push(id);
    save.equipped[currentTab] = id;
    sounds.coin();
    showToast(`Куплено: ${item.name}`);
  } else if (action === 'equip') {
    save.equipped[currentTab] = id;
    showToast(`Надето: ${item.name}`);
  }

  persistSave();
  renderShop();
  updateMenu();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    renderShop();
  };
});

// ==================== НАВИГАЦИЯ ====================
$('playBtn').onclick = () => startGame();
$('shopBtn').onclick = () => { updateMenu(); renderShop(); showScreen('shopScreen'); };
$('shopBackBtn').onclick = () => { updateMenu(); showScreen('mainMenu'); };
$('restartBtn').onclick = () => startGame();
$('menuBtn').onclick = () => { updateMenu(); showScreen('mainMenu'); };

// ==================== СТАРТ ====================
updateMenu();
updateHUD();
showScreen('mainMenu');
</script>
</body>
