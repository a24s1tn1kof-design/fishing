<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Рыбалка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0a1929;
    overflow: hidden;
    user-select: none;
    touch-action: manipulation;
  }
  body { display: flex; justify-content: center; align-items: center; }
  #game {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    max-height: 900px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    transition: background 2s ease;
  }
  #sky {
    position: absolute;
    inset: 0;
    z-index: 0;
    transition: background 2s ease;
  }
  #sky.day     { background: linear-gradient(180deg, #7EC8E3 0%, #A9D9EC 38%, #5DADE2 50%, #1B4F72 100%); }
  #sky.evening { background: linear-gradient(180deg, #FDB99B 0%, #CF8BF3 35%, #5B4B8A 60%, #1B1F3A 100%); }
  #sky.night   { background: linear-gradient(180deg, #0B1A2E 0%, #1B2A4A 40%, #0F1A30 60%, #05080F 100%); }
  #moon {
    position: absolute;
    top: 30px; right: 40px;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFFDE7, #E0E0E0 70%, #9E9E9E);
    box-shadow: 0 0 30px rgba(255,253,231,0.7), 0 0 60px rgba(255,253,231,0.3);
    opacity: 0;
    transition: opacity 1.5s;
    z-index: 1;
  }
  #moon.visible { opacity: 1; }
  .sun {
    position: absolute;
    top: 20px; right: 20px;
    width: 70px; height: 70px;
    z-index: 1;
    transition: opacity 1.5s;
  }
  .sun.hidden { opacity: 0; }
  .sun svg { width: 100%; height: 100%; animation: sunPulse 4s ease-in-out infinite; }
  @keyframes sunPulse {
    0%,100% { filter: drop-shadow(0 0 15px #FFD54F); }
    50%     { filter: drop-shadow(0 0 28px #FFEB3B); }
  }
  .cloud { position: absolute; opacity: 0.9; animation: cloudMove 40s linear infinite; z-index: 2; }
  .cloud.c1 { top: 50px;  left: -100px; width: 90px; animation-duration: 50s; }
  .cloud.c2 { top: 130px; left: -100px; width: 60px; animation-duration: 65s; animation-delay: -20s; }
  .cloud.c3 { top: 90px;  left: -100px; width: 70px; animation-duration: 75s; animation-delay: -40s; }
  @keyframes cloudMove {
    0%   { transform: translateX(0); }
    100% { transform: translateX(600px); }
  }
  #rainLayer {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: none;
    overflow: hidden;
  }
  #rainLayer.active { display: block; }
  .raindrop {
    position: absolute;
    width: 2px;
    height: 18px;
    background: linear-gradient(180deg, transparent, rgba(174,214,241,0.7));
    animation: rainFall linear infinite;
  }
  @keyframes rainFall {
    0%   { transform: translateY(-30px); }
    100% { transform: translateY(110vh); }
  }
  .shore {
    position: absolute;
    bottom: 38%;
    left: 0; right: 0;
    height: 70px;
    background: linear-gradient(180deg, #A08252 0%, #8B6F47 30%, #6B5437 70%, #4A3A26 100%);
    border-top: 4px solid #C4A570;
    z-index: 3;
  }
  .water {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 38%;
    background: linear-gradient(180deg, #2874A6 0%, #154360 100%);
    z-index: 2;
    overflow: hidden;
    transition: background 2s ease;
  }
  .water::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 14px;
    background: repeating-linear-gradient(90deg,
      transparent 0px, transparent 30px,
      rgba(255,255,255,0.3) 30px, rgba(255,255,255,0.3) 55px);
    border-radius: 50%;
    animation: wave 4s linear infinite;
  }
  @keyframes wave {
    0%   { transform: translateX(0); }
    100% { transform: translateX(55px); }
  }
  .fisher {
    position: absolute;
    bottom: calc(38% + 42px);
    left: 28%;
    transform: translateX(-50%);
    width: 80px;
    height: 100px;
    z-index: 5;
    transition: transform 0.15s;
  }
  .fisher svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35)); }
  .fisher.casting  { transform: translateX(-50%) rotate(-3deg); }
  .fisher.casting2 { transform: translateX(-50%) rotate(5deg); }
  #lineCanvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 6;
  }
  #bobber {
    position: absolute;
    width: 18px;
    height: 40px;
    transform: translate(-50%, -50%);
    z-index: 7;
    display: none;
  }
  #bobber svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
  #bobber.glow svg { filter: drop-shadow(0 0 10px #FFEB3B) drop-shadow(0 0 20px #FFEB3B); }
  #bobber.biting svg { animation: bobberBite 0.3s ease-in-out infinite; }
  @keyframes bobberBite {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50%     { transform: translateY(8px) rotate(3deg); }
  }
  .swimming-fish {
    position: absolute;
    width: 50px;
    height: 38px;
    z-index: 4;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    will-change: transform;
  }
  .swimming-fish.active { opacity: 1; }
  .swimming-fish.hooked { animation: fishHooked 0.3s ease-out forwards; }
  @keyframes fishHooked {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.4) rotate(-15deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .swimming-fish.reeling { animation: reel 0.7s ease-out forwards; }
  @keyframes reel {
    0%   { transform: scale(1) rotate(0); opacity: 1; }
    100% { transform: scale(0.6) rotate(-45deg) translateY(-300px); opacity: 0; }
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 12px;
    padding-right: 60px;
    display: flex;
    justify-content: space-between;
    gap: 6px;
    z-index: 20;
  }
  .hud-item {
    background: rgba(0,0,0,0.4);
    padding: 6px 12px;
    border-radius: 20px;
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    gap: 5px;
    border: 1px solid rgba(255,255,255,0.15);
    color: white;
    font-weight: bold;
    font-size: 15px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }
  .hud-item svg { width: 18px; height: 18px; }
  #weatherIcon {
    background: rgba(0,0,0,0.4);
    padding: 6px 10px;
    border-radius: 20px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
    color: white;
    font-weight: bold;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 4px;
    z-index: 20;
  }
  #weatherIcon svg { width: 18px; height: 18px; }
  #weatherIcon .label { display: none; }
  @media (min-width: 400px) { #weatherIcon .label { display: inline; } }
  #exitBtn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(231,76,60,0.85);
    border: 2px solid rgba(255,255,255,0.5);
    color: white;
    cursor: pointer;
    z-index: 21;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    transition: transform 0.1s;
    padding: 0;
    font-family: inherit;
  }
  #exitBtn:active { transform: scale(0.92); }
  #exitBtn.show { display: flex; }
  #exitBtn svg { width: 22px; height: 22px; }
</style>
</head>
<body>
<div id="game">
 <style>
  #actionBtn {
    position: absolute;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 50px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    background: linear-gradient(180deg, #F39C12, #E67E22);
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 0 #A04000, 0 8px 20px rgba(0,0,0,0.4);
    transition: all 0.1s;
    z-index: 20;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-family: inherit;
    min-width: 200px;
  }
  #actionBtn:active:not(:disabled) {
    transform: translateX(-50%) translateY(3px);
    box-shadow: 0 2px 0 #A04000, 0 4px 10px rgba(0,0,0,0.4);
  }
  #actionBtn:disabled {
    background: #7F8C8D;
    box-shadow: 0 5px 0 #566573;
    cursor: not-allowed;
  }
  #actionBtn.hidden { display: none; }
  #actionBtn.urgent { animation: urgentPulse 0.5s ease-in-out infinite; }
  @keyframes urgentPulse {
    0%,100% {
      transform: translateX(-50%) scale(1);
      box-shadow: 0 5px 0 #A04000, 0 8px 20px rgba(255,0,0,0.4);
    }
    50% {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 5px 0 #A04000, 0 8px 30px rgba(255,100,0,0.8);
    }
  }
  #catch {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(255,255,255,0.97);
    padding: 14px 24px;
    border-radius: 18px;
    font-size: 18px;
    font-weight: bold;
    color: #E67E22;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    z-index: 30;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
    flex-direction: column;
  }
  #catch.show { transform: translate(-50%, -50%) scale(1); }
  #catch svg { width: 42px; height: 32px; }
  #catch .catch-name   { font-size: 15px; color: #2C3E50; }
  #catch .catch-weight { font-size: 12px; color: #7F8C8D; font-weight: normal; }
  #tensionBar {
    position: absolute;
    bottom: calc(95px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 26px;
    background: rgba(0,0,0,0.6);
    border-radius: 13px;
    overflow: hidden;
    display: none;
    z-index: 20;
    border: 2px solid rgba(255,255,255,0.8);
  }
  #tensionFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2ECC71, #F39C12, #E74C3C);
    transition: width 0.03s linear;
  }
  #perfectZone {
    position: absolute;
    top: 0; bottom: 0;
    background: rgba(255,255,255,0.4);
    border-left: 2px solid #FFF;
    border-right: 2px solid #FFF;
    pointer-events: none;
    display: none;
    box-shadow: inset 0 0 12px rgba(255,255,255,0.5);
  }
  #splash {
    position: absolute;
    pointer-events: none;
    z-index: 8;
    display: none;
    transform: translate(-50%, -50%);
  }
  #splash.active { display: block; animation: splash 0.7s ease-out forwards; }
  @keyframes splash {
    0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
  }
  .toast {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0,0,0,0.85);
    color: white;
    padding: 10px 20px;
    border-radius: 24px;
    font-weight: bold;
    font-size: 14px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    border: 2px solid #FFD700;
    white-space: nowrap;
    max-width: 90%;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .achievement-popup {
    position: absolute;
    top: 120px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: linear-gradient(135deg, #FFD700 0%, #FFA000 100%);
    color: #2C3E50;
    padding: 12px 20px;
    border-radius: 16px;
    font-weight: bold;
    font-size: 14px;
    z-index: 250;
    box-shadow: 0 8px 30px rgba(255,215,0,0.6);
    display: flex;
    align-items: center;
    gap: 10px;
    border: 3px solid #FFF;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    opacity: 0;
    pointer-events: none;
    max-width: 90%;
  }
  .achievement-popup.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .achievement-popup svg { width: 32px; height: 32px; flex-shrink: 0; }
  .achievement-popup .ach-title { font-size: 11px; opacity: 0.8; }
  .achievement-popup .ach-name  { font-size: 15px; }
 </style>
 <style>
  .screen {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: none;
    flex-direction: column;
    background: linear-gradient(180deg, #1B4F72 0%, #0a1929 100%);
    color: white;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
  }
  .screen.show { display: flex; }
  .screen-title {
    font-size: 32px;
    text-align: center;
    font-weight: 900;
    letter-spacing: 3px;
    color: #FFD700;
    text-shadow: 0 3px 0 #B8860B, 0 6px 20px rgba(0,0,0,0.6);
    margin: 16px 0;
  }
  .screen-sub {
    text-align: center;
    font-size: 15px;
    opacity: 0.8;
    margin-bottom: 20px;
  }
  .menu-btn {
    padding: 14px 28px;
    font-size: 17px;
    font-weight: bold;
    border: none;
    border-radius: 16px;
    color: white;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-family: inherit;
    margin-bottom: 10px;
    transition: transform 0.1s;
    box-shadow: 0 5px 0 rgba(0,0,0,0.4);
    width: 100%;
    max-width: 340px;
    align-self: center;
  }
  .menu-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
  .menu-btn.play   { background: linear-gradient(180deg, #2ECC71, #27AE60); box-shadow: 0 5px 0 #1E8449; }
  .menu-btn.shop   { background: linear-gradient(180deg, #F39C12, #E67E22); box-shadow: 0 5px 0 #A04000; }
  .menu-btn.back   { background: linear-gradient(180deg, #7F8C8D, #566573); box-shadow: 0 5px 0 #2C3E50; }
  .menu-btn.encycl { background: linear-gradient(180deg, #9B59B6, #8E44AD); box-shadow: 0 5px 0 #633974; }
  .menu-btn.achiev { background: linear-gradient(180deg, #3498DB, #2980B9); box-shadow: 0 5px 0 #1A5276; }
  .menu-btn.small {
    width: auto;
    padding: 10px 18px;
    margin: 0;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    gap: 8px;
  }
  .coins {
    background: rgba(255,215,0,0.15);
    border: 2px solid #FFD700;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 16px;
    color: #FFD700;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .coins svg { width: 20px; height: 20px; }
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    background: rgba(0,0,0,0.3);
    padding: 4px;
    border-radius: 12px;
  }
  .tab {
    flex: 1;
    padding: 9px 3px;
    border: none;
    background: transparent;
    color: white;
    font-weight: bold;
    font-size: 13px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    opacity: 0.6;
  }
  .tab.active {
    background: linear-gradient(180deg, #F39C12, #E67E22);
    opacity: 1;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 16px;
  }
  .list-item {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.2s;
  }
  .list-item.owned  { border-color: #FFD700; background: rgba(255,215,0,0.08); }
  .list-item.locked { opacity: 0.45; filter: grayscale(0.7); }
  .item-icon {
    width: 46px; height: 46px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
  }
  .item-icon svg { width: 38px; height: 38px; }
  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .item-desc { font-size: 11px; opacity: 0.7; line-height: 1.3; }
  .item-btn {
    padding: 7px 12px;
    border: none;
    border-radius: 9px;
    font-weight: bold;
    font-size: 12px;
    color: white;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: transform 0.1s;
    flex-shrink: 0;
  }
  .item-btn.buy     { background: linear-gradient(180deg, #2ECC71, #27AE60); box-shadow: 0 3px 0 #1E8449; }
  .item-btn.equip   { background: linear-gradient(180deg, #3498DB, #2980B9); box-shadow: 0 3px 0 #1A5276; }
  .item-btn.equipped{ background: #566573; cursor: default; box-shadow: none; }
  .item-btn:active:not(.equipped) { transform: translateY(2px); }
  .item-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .rarity-common    { color: #95A5A6; }
  .rarity-uncommon  { color: #2ECC71; }
  .rarity-rare      { color: #3498DB; }
  .rarity-epic      { color: #9B59B6; }
  .rarity-legendary { color: #F39C12; }
  .rarity-badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 6px;
    background: rgba(255,255,255,0.15);
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 13px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .stat-row span:last-child { font-weight: bold; color: #FFD700; }
  .durability-bar {
    height: 6px;
    background: rgba(0,0,0,0.4);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
  }
  .durability-fill {
    height: 100%;
    background: linear-gradient(90deg, #E74C3C 0%, #F39C12 30%, #2ECC71 100%);
    transition: width 0.3s;
  }
  .durability-fill.warning { background: linear-gradient(90deg, #E74C3C, #C0392B); }
 </style>
 </head>
<body>
<div id="game">
  <div id="sky" class="day"></div>
  <div id="moon"></div>

  <div class="sun" id="sunEl">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="24" fill="#FFD54F"/>
      <circle cx="50" cy="50" r="24" fill="none" stroke="#FFB300" stroke-width="2"/>
      <g stroke="#FFD54F" stroke-width="4" stroke-linecap="round">
        <line x1="50" y1="10" x2="50" y2="20"/>
        <line x1="50" y1="80" x2="50" y2="90"/>
        <line x1="10" y1="50" x2="20" y2="50"/>
        <line x1="80" y1="50" x2="90" y2="50"/>
        <line x1="22" y1="22" x2="29" y2="29"/>
        <line x1="71" y1="71" x2="78" y2="78"/>
        <line x1="78" y1="22" x2="71" y2="29"/>
        <line x1="29" y1="71" x2="22" y2="78"/>
      </g>
    </svg>
  </div>

  <div class="cloud c1">
    <svg viewBox="0 0 100 40">
      <ellipse cx="30" cy="25" rx="25" ry="14" fill="#fff"/>
      <ellipse cx="55" cy="20" rx="22" ry="16" fill="#fff"/>
      <ellipse cx="75" cy="27" rx="20" ry="12" fill="#fff"/>
    </svg>
  </div>
  <div class="cloud c2">
    <svg viewBox="0 0 100 40">
      <ellipse cx="30" cy="25" rx="25" ry="14" fill="#fff" opacity="0.85"/>
      <ellipse cx="55" cy="20" rx="22" ry="16" fill="#fff" opacity="0.85"/>
      <ellipse cx="75" cy="27" rx="20" ry="12" fill="#fff" opacity="0.85"/>
    </svg>
  </div>
  <div class="cloud c3">
    <svg viewBox="0 0 100 40">
      <ellipse cx="30" cy="25" rx="25" ry="14" fill="#fff" opacity="0.7"/>
      <ellipse cx="55" cy="20" rx="22" ry="16" fill="#fff" opacity="0.7"/>
      <ellipse cx="75" cy="27" rx="20" ry="12" fill="#fff" opacity="0.7"/>
    </svg>
  </div>

// ==================== ЗВУКИ ====================
let audioCtx = null;
let muted = false;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
}

function playTone(freq, duration, type = 'sine', volume = 0.15, slideTo = null) {
  if (muted || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playNoise(duration, volume = 0.1, filterFreq = 1000) {
  if (muted || !audioCtx) return;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = filterFreq;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  source.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  source.start();
  source.stop(audioCtx.currentTime + duration);
}

const sounds = {
  cast:        () => playTone(600, 0.25, 'sine', 0.1, 150),
  splash:      () => playNoise(0.4, 0.15, 800),
  biteSoft:    () => { playTone(500, 0.08, 'sine', 0.08); setTimeout(() => playTone(600, 0.08, 'sine', 0.08), 80); },
  biteSharp:   () => { playTone(900, 0.06, 'square', 0.12); setTimeout(() => playTone(1100, 0.06, 'square', 0.12), 60); },
  biteFalse:   () => playTone(300, 0.15, 'sawtooth', 0.08, 200),
  hook:        () => playTone(400, 0.15, 'triangle', 0.2, 900),
  catch:       () => { playTone(523, 0.1, 'sine', 0.15); setTimeout(() => playTone(659, 0.1, 'sine', 0.15), 100); setTimeout(() => playTone(784, 0.2, 'sine', 0.15), 200); },
  bigCatch:    () => { playTone(523, 0.12, 'sine', 0.18); setTimeout(() => playTone(659, 0.12, 'sine', 0.18), 120); setTimeout(() => playTone(784, 0.12, 'sine', 0.18), 240); setTimeout(() => playTone(1046, 0.3, 'sine', 0.2), 360); },
  miss:        () => playTone(300, 0.3, 'sawtooth', 0.1, 100),
  reel:        () => playTone(200, 0.4, 'sawtooth', 0.08, 500),
  rodBreak:    () => { playNoise(0.3, 0.25, 2000); playTone(200, 0.4, 'sawtooth', 0.15, 60); },
  coin:        () => { playTone(1200, 0.08, 'sine', 0.15); setTimeout(() => playTone(1600, 0.12, 'sine', 0.15), 80); },
  achievement: () => { playTone(784, 0.15, 'sine', 0.2); setTimeout(() => playTone(1046, 0.15, 'sine', 0.2), 150); setTimeout(() => playTone(1318, 0.35, 'sine', 0.2), 300); },
  gameover:    () => { playTone(400, 0.2, 'sine', 0.15); setTimeout(() => playTone(300, 0.2, 'sine', 0.15), 200); setTimeout(() => playTone(200, 0.4, 'sine', 0.15), 400); },
  thunder:     () => playNoise(1.2, 0.3, 300)
};

  gear: [
    { id: 'gear_none',   name: 'Без снастей',    desc: 'Обычная рыбалка',                     price: 0,   bonus: 0 },
    { id: 'gear_scale',  name: 'Мерная линейка', desc: 'Показывает вес рыбы при поклёвке',    price: 150, bonus: 'scale' },
    { id: 'gear_sonar',  name: 'Эхолот',         desc: 'Шире зона подсечки',                  price: 400, bonus: 0.5 },
    { id: 'gear_both',   name: 'Полный набор',   desc: 'Эхолот + мерная линейка',             price: 900, bonus: 'both' }
  ]
};

// ==================== ДОСТИЖЕНИЯ ====================
const ACHIEVEMENTS = [
  { id: 'first',   name: 'Первая рыбка',      desc: 'Поймай свою первую рыбу',          check: s => s.totalCaught >= 1 },
  { id: 'ten',     name: 'Рыбак-новичок',     desc: 'Поймай 10 рыб всего',              check: s => s.totalCaught >= 10 },
  { id: 'hundred', name: 'Опытный рыбак',     desc: 'Поймай 100 рыб всего',             check: s => s.totalCaught >= 100 },
  { id: 'catfish', name: 'Сомовья охота',     desc: 'Поймай сома',                      check: s => (s.caught.catfish || 0) >= 1 },
  { id: 'sturgeon',name: 'Царская рыба',      desc: 'Поймай осетра',                    check: s => (s.caught.sturgeon || 0) >= 1 },
  { id: 'big',     name: 'Крупная рыба',      desc: 'Поймай рыбу весом 10 кг+',         check: s => s.biggest >= 10 },
  { id: 'rich',    name: 'Богач',             desc: 'Накопи 1000 монет',                check: s => save.coins >= 1000 },
  { id: 'record',  name: 'Рекордсмен',        desc: 'Набери 100+ очков за игру',        check: s => save.best >= 100 },
  { id: 'night',   name: 'Ночной охотник',    desc: 'Поймай 5 рыб ночью за раз',        check: s => s.nightCatches >= 5 },
  { id: 'perfect', name: 'Снайпер',           desc: 'Поймай 10 рыб без промаха за раз', check: s => s.perfectStreak >= 10 }
];

// ==================== СОХРАНЕНИЕ ====================
const SAVE_KEY = 'fishing_save_v5';

function defaultSave() {
  return {
    coins: 0,
    best: 0,
    totalCaught: 0,
    biggest: 0,
    caught: {},
    owned: { rods: ['rod_basic'], baits: ['bait_worm'], gear: ['gear_none'] },
    equipped: { rods: 'rod_basic', baits: 'bait_worm', gear: 'gear_none' },
    durability: { rod_basic: 100 },
    unlockedAch: []
  };
}

function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    const d = defaultSave();
    return {
      ...d,
      ...s,
      owned: { ...d.owned, ...(s.owned || {}) },
      equipped: { ...d.equipped, ...(s.equipped || {}) },
      durability: { ...d.durability, ...(s.durability || {}) }
    };
  } catch(e) { return defaultSave(); }
}

let save = loadSave();

function persistSave() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(save));
}

// ==================== DOM ====================
const $ = id => document.getElementById(id);
const gameEl = $('game');
const skyEl = $('sky');
const moonEl = $('moon');
const sunEl = $('sunEl');
const actionBtn = $('actionBtn');
const bobberEl = $('bobber');
const fisherEl = $('fisher');
const lineCanvas = $('lineCanvas');
const ctx = lineCanvas.getContext('2d');
const scoreTextEl = $('scoreText');
const coinsTextEl = $('coinsText');
const weatherSvg = $('weatherSvg');
const weatherLabel = $('weatherLabel');
const catchEl = $('catch');
const tensionBar = $('tensionBar');
const tensionFill = $('tensionFill');
const perfectZoneEl = $('perfectZone');
const splashEl = $('splash');
const toastEl = $('toast');
const achPopupEl = $('achPopup');
const rainLayer = $('rainLayer');
const exitBtn = $('exitBtn');
</script>
<script>
// ==================== СОСТОЯНИЕ ====================
let state = 'idle';
let score = 0;
let biteTimeout = null;
let currentFish = null;
let currentFishWeight = 0;
let tension = 0;
let tensionDirection = 1;
let tensionInterval = null;
let perfectZone = null;
let swimmingFish = [];
let animFrame = null;
let lineStartPos = null;
let bobberPos = null;
let weather = { type: 'clear', label: 'Ясно' };
let dayPhase = 'day';
let sessionStats = { points: 0, caught: 0, missed: 0, boots: 0, biggest: 0, nightCatches: 0, perfectStreak: 0 };
let gameRunning = false;

// ==================== КАНВАС ====================
function resizeCanvas() {
  lineCanvas.width = gameEl.clientWidth;
  lineCanvas.height = gameEl.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==================== ХЕЛПЕРЫ ====================
function getEquipped() {
  const rods = SHOP_ITEMS.rods || [];
  const baits = SHOP_ITEMS.baits || [];
  const gear = SHOP_ITEMS.gear || [];
  return {
    rod:  rods.find(r => r.id === save.equipped.rods) || rods[0],
    bait: baits.find(b => b.id === save.equipped.baits) || baits[0],
    gear: gear.find(g => g.id === save.equipped.gear) || gear[0]
  };
}

function getRodDurability() {
  return save.durability[save.equipped.rods] ?? 100;
}

function setRodDurability(val) {
  save.durability[save.equipped.rods] = Math.max(0, Math.min(100, val));
}

function updateHUD() {
  scoreTextEl.textContent = score;
  coinsTextEl.textContent = save.coins;
}

function updateMenu() {
  $('menuCoins').textContent = save.coins;
  $('menuBest').textContent = save.best;
  $('shopCoins').textContent = save.coins;
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  if (id) $(id).classList.add('show');
}

// ==================== ВРЕМЯ СУТОК И ПОГОДА ====================
function pickWeather() {
  const r = Math.random();
  if (r < 0.5) weather = { type: 'clear', label: 'Ясно' };
  else if (r < 0.75) weather = { type: 'cloudy', label: 'Облачно' };
  else if (r < 0.93) weather = { type: 'rain', label: 'Дождь' };
  else weather = { type: 'storm', label: 'Гроза' };
  weatherSvg.innerHTML = weatherSVG(weather.type);
  weatherLabel.textContent = weather.label;
  updateRainEffect();
}

function updateRainEffect() {
  if (weather.type === 'rain' || weather.type === 'storm') {
    rainLayer.classList.add('active');
    rainLayer.innerHTML = '';
    const count = weather.type === 'storm' ? 60 : 35;
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      d.className = 'raindrop';
      d.style.left = Math.random() * 100 + '%';
      d.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
      d.style.animationDelay = (Math.random() * 2) + 's';
      d.style.opacity = 0.4 + Math.random() * 0.5;
      rainLayer.appendChild(d);
    }
    if (weather.type === 'storm' && !muted) sounds.thunder();
  } else {
    rainLayer.classList.remove('active');
    rainLayer.innerHTML = '';
  }
}

function applyTimeOfDay() {
  skyEl.className = dayPhase;
  if (dayPhase === 'night') {
    moonEl.classList.add('visible');
    sunEl.classList.add('hidden');
    bobberEl.classList.add('glow');
  } else if (dayPhase === 'evening') {
    moonEl.classList.remove('visible');
    sunEl.classList.remove('hidden');
    bobberEl.classList.remove('glow');
  } else {
    moonEl.classList.remove('visible');
    sunEl.classList.remove('hidden');
    bobberEl.classList.remove('glow');
  }
}

function pickTimeOfDay() {
  const r = Math.random();
  if (r < 0.55) dayPhase = 'day';
  else if (r < 0.8) dayPhase = 'evening';
  else dayPhase = 'night';
  applyTimeOfDay();
}

// ==================== ВЫБОР РЫБЫ ====================
function pickFish() {
  const bait = getEquipped().bait;
  const weighted = BASE_FISH.map(f => {
    let w = f.chance;
    if (weather.type === 'rain' || weather.type === 'storm') w *= 1 + (f.rainBonus || 0);
    if (dayPhase === 'night') w *= 1 + (f.nightBonus || 0);
    if (bait && bait.effect === 'small' && (f.key === 'perch' || f.key === 'carp' || f.key === 'ruffe')) w *= 1 + bait.value;
    if (bait && bait.effect === 'predator' && (f.key === 'pike' || f.key === 'catfish' || f.key === 'sturgeon')) w *= 1 + bait.value;
    if (bait && bait.effect === 'rare' && f.points >= 3 && f.key !== 'boot') w *= 1 + bait.value;
    if (f.key === 'boot' && bait && bait.effect === 'rare') w *= 0.3;
    return { ...f, w };
  });
  const total = weighted.reduce((s, f) => s + f.w, 0);
  let r = Math.random() * total;
  for (const f of weighted) {
    r -= f.w;
    if (r <= 0) return f;
  }
  return weighted[0];
}

function rollWeight(fish) {
  const t = Math.random();
  const skewed = Math.pow(t, 2);
  return (fish.minKg + (fish.maxKg - fish.minKg) * skewed).toFixed(2);
}

// ==================== ПЛАВАЮЩИЕ РЫБЫ ====================
const MAX_SWIMMING = 6;

function createSwimmingFish() {
  const gameRect = gameEl.getBoundingClientRect();
  const waterTop = gameRect.height * 0.64;
  const waterBottom = gameRect.height - 20;
  const el = document.createElement('div');
  el.className = 'swimming-fish';
  const fish = pickFish();
  el.innerHTML = fishSVG(fish.key, 50);
  el.dataset.fishKey = fish.key;
  const y = waterTop + Math.random() * (waterBottom - waterTop);
  const x = Math.random() * (gameRect.width - 60);
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  gameEl.appendChild(el);
  const dir = Math.random() < 0.5 ? 1 : -1;
  const speed = 0.15 + Math.random() * 0.35;
  const obj = { el, x, y, dir, speed, alive: true, key: fish.key };
  el.style.transform = `scaleX(${dir})`;
  swimmingFish.push(obj);
  setTimeout(() => el.classList.add('active'), 50);
  return obj;
}

function removeSwimmingFish(obj) {
  obj.alive = false;
  if (obj.el.parentNode) obj.el.parentNode.removeChild(obj.el);
  swimmingFish = swimmingFish.filter(f => f !== obj);
}

function updateSwimmingFish() {
  const gameRect = gameEl.getBoundingClientRect();
  for (const f of swimmingFish) {
    if (!f.alive) continue;
    f.x += f.dir * f.speed;
    f.el.style.left = f.x + 'px';
    if ((f.dir > 0 && f.x > gameRect.width + 60) || (f.dir < 0 && f.x < -60)) {
      removeSwimmingFish(f);
    }
  }
}

function spawnSwimmingLoop() {
  if (swimmingFish.length < MAX_SWIMMING && Math.random() < 0.03) {
    createSwimmingFish();
  }
}

function clearAllSwimming() {
  swimmingFish.forEach(f => {
    f.alive = false;
    if (f.el.parentNode) f.el.parentNode.removeChild(f.el);
  });
  swimmingFish = [];
}

// ==================== ЛЕСКА ====================
function getRodTip() {
  const gameRect = gameEl.getBoundingClientRect();
  const fisherRect = fisherEl.getBoundingClientRect();
  return {
    x: fisherRect.left - gameRect.left + fisherRect.width * 0.975,
    y: fisherRect.top - gameRect.top + fisherRect.height * 0.10
  };
}

function pickLandingPoint() {
  const gameRect = gameEl.getBoundingClientRect();
  const rodTip = getRodTip();
  const minX = rodTip.x + 30;
  const maxX = gameRect.width - 40;
  const waterTop = gameRect.height * 0.65;
  const waterBottom = gameRect.height - 60;
  return {
    x: minX + Math.random() * (maxX - minX),
    y: waterTop + Math.random() * (waterBottom - waterTop)
  };
}

function drawLine(from, to, sag = 0) {
  ctx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
  if (!from || !to) return;
  ctx.beginPath();
  ctx.moveTo(from.x, from.y);
  const midX = (from.x + to.x) / 2;
  const midY = (from.y + to.y) / 2 + sag;
  ctx.quadraticCurveTo(midX, midY, to.x, to.y);
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function clearLineCanvas() {
  ctx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
}

// ==================== ИГРОВОЙ ЦИКЛ ====================
let frameCount = 0;
function loop() {
  frameCount++;
  if (gameRunning) {
    updateSwimmingFish();
    if (frameCount % 30 === 0) spawnSwimmingLoop();
  }
  if (bobberPos && lineStartPos) {
    const sag = state === 'biting' ? 6 + Math.sin(frameCount * 0.3) * 4 : 8;
    drawLine(lineStartPos, bobberPos, sag);
  }
  animFrame = requestAnimationFrame(loop);
}
loop();
 </script>
 <script>
// ==================== СТАРТ / СТОП ====================
function startGame() {
  score = 0;
  sessionStats = { points: 0, caught: 0, missed: 0, boots: 0, biggest: 0, nightCatches: 0, perfectStreak: 0 };
  gameRunning = true;

  pickWeather();
  pickTimeOfDay();
  clearAllSwimming();
  for (let i = 0; i < 3; i++) createSwimmingFish();

  updateHUD();
  showScreen(null);
  actionBtn.classList.remove('hidden');
  exitBtn.classList.add('show');
  resetRod();
}

function resetRod() {
  state = 'idle';
  actionBtn.disabled = false;
  actionBtn.classList.remove('urgent');
  actionBtn.textContent = 'Забросить';
  bobberEl.style.display = 'none';
  bobberEl.classList.remove('biting');
  bobberPos = null;
  lineStartPos = null;
  clearLineCanvas();
  currentFish = null;
}

function cast() {
  if (state !== 'idle' || !gameRunning) return;
  state = 'casting';
  actionBtn.disabled = true;
  initAudio();
  sounds.cast();
  fisherEl.classList.add('casting2');
  setTimeout(() => fisherEl.classList.remove('casting2'), 250);

  const rodTip = getRodTip();
  const landing = pickLandingPoint();
  lineStartPos = { x: rodTip.x, y: rodTip.y };

  const duration = 400;
  const start = performance.now();
  const startPos = { x: rodTip.x, y: rodTip.y };

  bobberEl.style.display = 'block';
  bobberEl.style.left = landing.x + 'px';
  bobberEl.style.top = startPos.y + 'px';
  bobberEl.style.opacity = '0.5';

  function animateFly(now) {
    const t = Math.min(1, (now - start) / duration);
    const x = startPos.x + (landing.x - startPos.x) * t;
    const arcY = startPos.y + (landing.y - startPos.y) * t - Math.sin(t * Math.PI) * 80;
    bobberEl.style.left = x + 'px';
    bobberEl.style.top = arcY + 'px';
    bobberPos = { x, y: arcY };
    if (t < 1) requestAnimationFrame(animateFly);
    else {
      bobberEl.style.opacity = '1';
      bobberPos = { x: landing.x, y: landing.y };
      sounds.splash();
      showSplash(landing.x, landing.y);
      state = 'waiting';
      actionBtn.textContent = 'Ждём...';
      scheduleBite();
    }
  }
  requestAnimationFrame(animateFly);
}

// ==================== ТИПЫ ПОКЛЁВОК ====================
function scheduleBite() {
  const wait = 1000 + Math.random() * 3500;
  biteTimeout = setTimeout(() => {
    if (state !== 'waiting') return;
    startBite();
  }, wait);
}

function startBite() {
  if (state !== 'waiting') return;
  state = 'biting';
  currentFish = pickFish();
  currentFishWeight = parseFloat(rollWeight(currentFish));

  const r = Math.random();
  let biteType;
  if (currentFish.key === 'boot') biteType = 'false';
  else if (r < 0.2) biteType = 'false';
  else if (r < 0.7) biteType = 'soft';
  else biteType = 'sharp';

  if (biteType === 'false') {
    sounds.biteFalse();
    bobberEl.classList.add('biting');
    actionBtn.textContent = 'ПОДСЕЧКА!';
    actionBtn.disabled = false;
    actionBtn.classList.add('urgent');
    setTimeout(() => {
      if (state === 'biting') {
        bobberEl.classList.remove('biting');
        actionBtn.classList.remove('urgent');
        state = 'idle';
        actionBtn.disabled = false;
        actionBtn.textContent = 'Забросить';
        bobberEl.style.display = 'none';
        bobberPos = null;
        clearLineCanvas();
        showToast('Пустая поклёвка!');
      }
    }, 700);
    return;
  }

  if (biteType === 'soft') {
    sounds.biteSoft();
    actionBtn.textContent = 'Подсекай';
    actionBtn.classList.remove('urgent');
  } else {
    sounds.biteSharp();
    actionBtn.textContent = 'ПОДСЕЧКА!';
    actionBtn.classList.add('urgent');
  }
  actionBtn.disabled = false;
  bobberEl.classList.add('biting');

  const matching = swimmingFish.filter(f => f.key === currentFish.key && f.alive);
  if (matching.length > 0) matching[0].el.classList.add('hooked');

  // Показать вес, если куплена линейка
  const gear = getEquipped().gear;
  if (gear && (gear.bonus === 'scale' || gear.bonus === 'both')) {
    showToast(`Клюёт ${currentFish.name}, вес ~${currentFishWeight} кг`);
  }

  const biteWindow = currentFish.biteMin + Math.random() * (currentFish.biteMax - currentFish.biteMin);
  biteTimeout = setTimeout(() => {
    if (state === 'biting') {
      bobberEl.classList.remove('biting');
      actionBtn.classList.remove('urgent');
      sessionStats.missed++;
      state = 'idle';
      actionBtn.disabled = false;
      actionBtn.textContent = 'Забросить';
      bobberEl.style.display = 'none';
      bobberPos = null;
      clearLineCanvas();
      showCatch('Упустил!', currentFish.key, '#E74C3C');
    }
  }, biteWindow);
}

// ==================== ПОДСЕЧКА ====================
function hook() {
  if (state !== 'biting') return;
  state = 'fighting';
  actionBtn.disabled = true;
  actionBtn.classList.remove('urgent');
  actionBtn.textContent = 'Тяни!';
  clearTimeout(biteTimeout);
  bobberEl.classList.remove('biting');
  sounds.hook();
  if (bobberPos) showSplash(bobberPos.x, bobberPos.y);

  tension = 0;
  tensionDirection = 1;
  const gear = getEquipped().gear;
  let zoneWidth = 16 - currentFish.difficulty * 2.5;
  if (gear && (gear.bonus === 0.5 || gear.bonus === 'both')) zoneWidth *= 1.5;
  perfectZone = { start: 50 - zoneWidth, end: 50 + zoneWidth };

  tensionBar.style.display = 'block';
  tensionFill.style.width = '0%';
  perfectZoneEl.style.display = 'block';
  perfectZoneEl.style.left = perfectZone.start + '%';
  perfectZoneEl.style.width = (perfectZone.end - perfectZone.start) + '%';

  const speed = 0.9 + currentFish.difficulty * 0.7;
  tensionInterval = setInterval(() => {
    tension += tensionDirection * speed;
    if (tension >= 100) { tension = 100; tensionDirection = -1; }
    if (tension <= 0) { tension = 0; tensionDirection = 1; }
    tensionFill.style.width = tension + '%';
  }, 20);

  actionBtn.textContent = 'СТОП!';
  actionBtn.disabled = false;
  actionBtn.onclick = releaseTension;
}

// ==================== ВЫВАЖИВАНИЕ И ИЗНОС ====================
function releaseTension() {
  if (state !== 'fighting') return;
  clearInterval(tensionInterval);
  tensionBar.style.display = 'none';
  perfectZoneEl.style.display = 'none';
  actionBtn.onclick = mainAction;

  const inZone = tension >= perfectZone.start && tension <= perfectZone.end;
  const isBoot = currentFish.key === 'boot';
  const rod = getEquipped().rod;
  const durability = getRodDurability();

  const tooHeavy = currentFishWeight > rod.maxWeight;
  const willBreak = tooHeavy || (currentFishWeight > rod.maxWeight * 0.7 && durability < 40);

  if (inZone) {
    if (willBreak && !isBoot) {
      sounds.rodBreak();
      setRodDurability(0);
      persistSave();
      showCatch('Удочка сломалась!', currentFish.key, '#E74C3C');
      showToast(`Слишком тяжёлая рыба (${currentFishWeight} кг) для ${rod.name}`);
      setTimeout(() => { endGame(true); }, 1500);
      return;
    }

    if (isBoot) {
      sessionStats.boots++;
      showCatch(`${currentFish.name}`, currentFish.key, '#E74C3C');
      sounds.miss();
      setRodDurability(durability - 2);
      persistSave();
      sessionStats.perfectStreak = 0;
    } else {
      let points = currentFish.points;
      const bait = getEquipped().bait;
      if (bait && bait.effect === 'rare') points = Math.ceil(points * (1 + bait.value));
      score += points;
      sessionStats.points += points;
      sessionStats.caught++;

      if (currentFishWeight > sessionStats.biggest) sessionStats.biggest = currentFishWeight;
      if (currentFishWeight > save.biggest) save.biggest = currentFishWeight;

      save.caught[currentFish.key] = (save.caught[currentFish.key] || 0) + 1;
      save.totalCaught = (save.totalCaught || 0) + 1;
      if (dayPhase === 'night') sessionStats.nightCatches++;
      sessionStats.perfectStreak++;

      const wear = Math.min(15, Math.max(1, Math.round(currentFishWeight * 0.8)));
      setRodDurability(durability - wear);

      if (currentFishWeight > rod.maxWeight * 0.6) sounds.bigCatch();
      else sounds.catch();

      showCatchFish(currentFish, currentFishWeight, points);
      animateReel();
      checkAchievements(sessionStats);
    }
  } else {
    sessionStats.missed++;
    sessionStats.perfectStreak = 0;
    showCatch('Сорвалась!', currentFish.key, '#E74C3C');
    sounds.miss();
    setRodDurability(durability - 1);
  }

  persistSave();
  updateHUD();
  setTimeout(resetRod, 700);
}
 </script>
 <script>
function animateReel() {
  const matching = swimmingFish.filter(f => f.key === currentFish.key && f.alive);
  if (matching.length > 0) {
    matching[0].el.classList.add('reeling');
    setTimeout(() => removeSwimmingFish(matching[0]), 800);
  }
  sounds.reel();
}

function showSplash(x, y) {
  splashEl.style.left = x + 'px';
  splashEl.style.top = y + 'px';
  splashEl.classList.add('active');
  setTimeout(() => splashEl.classList.remove('active'), 700);
}

function showCatch(text, fishKey, color) {
  catchEl.innerHTML = fishSVG(fishKey, 40) + `<div><div>${text}</div></div>`;
  catchEl.style.color = color || '#E67E22';
  catchEl.classList.add('show');
  setTimeout(() => catchEl.classList.remove('show'), 1000);
}

function showCatchFish(fish, weight, points) {
  const rarityClass = 'rarity-' + fish.rarity;
  catchEl.innerHTML = `
    ${fishSVG(fish.key, 40)}
    <div style="text-align:center">
      <div style="font-size:16px">+${points} ${fish.name}</div>
      <div class="catch-weight ${rarityClass}">${weight} кг · ${fish.rarity}</div>
    </div>`;
  catchEl.style.color = '#27AE60';
  catchEl.classList.add('show');
  setTimeout(() => catchEl.classList.remove('show'), 1200);
}

function checkAchievements(stats) {
  const ctxData = {
    totalCaught: save.totalCaught,
    caught: save.caught,
    biggest: save.biggest,
    nightCatches: stats.nightCatches,
    perfectStreak: stats.perfectStreak
  };
  for (const a of ACHIEVEMENTS) {
    if (save.unlockedAch.includes(a.id)) continue;
    let ok = false;
    try { ok = a.check(ctxData); } catch(e) { ok = false; }
    if (ok) {
      save.unlockedAch.push(a.id);
      persistSave();
      showAchievement(a);
    }
  }
}

function showAchievement(a) {
  sounds.achievement();
  achPopupEl.innerHTML = `
    <svg viewBox="0 0 24 24" fill="#FFF" stroke="#8B6914" stroke-width="1.5">
      <path d="M12 2 L15 9 L22 9 L16 14 L18 21 L12 17 L6 21 L8 14 L2 9 L9 9 Z"/>
    </svg>
    <div>
      <div class="ach-title">ДОСТИЖЕНИЕ</div>
      <div class="ach-name">${a.name}</div>
    </div>`;
  achPopupEl.classList.add('show');
  setTimeout(() => achPopupEl.classList.remove('show'), 3000);
}

function endGame(broken) {
  if (!gameRunning) return;
  gameRunning = false;
  state = 'idle';
  clearTimeout(biteTimeout);
  clearInterval(tensionInterval);
  tensionBar.style.display = 'none';
  perfectZoneEl.style.display = 'none';
  bobberEl.style.display = 'none';
  actionBtn.classList.add('hidden');
  actionBtn.classList.remove('urgent');
  exitBtn.classList.remove('show');
  bobberPos = null;
  lineStartPos = null;
  clearLineCanvas();
  clearAllSwimming();
  sounds.gameover();

  const rod = getEquipped().rod;
  const multiplier = 1 + (rod && rod.bonus ? rod.bonus : 0);
  const coinsEarned = Math.max(0, Math.round(score * 5 * multiplier));
  save.coins += coinsEarned;

  const isRecord = score > save.best;
  if (isRecord) save.best = score;
  persistSave();

  $('finalScore').textContent = sessionStats.caught;
  $('rewardLine').textContent = broken
    ? `Удочка сломалась! +${coinsEarned} монет`
    : `+${coinsEarned} монет${isRecord && score > 0 ? ' • Новый рекорд!' : ''}`;
  $('statPoints').textContent = sessionStats.points;
  $('statMissed').textContent = sessionStats.missed;
  $('statBoots').textContent = sessionStats.boots;
  $('statBiggest').textContent = sessionStats.biggest > 0 ? sessionStats.biggest + ' кг' : '—';
  $('statBest').textContent = save.best;

  if (coinsEarned > 0) setTimeout(() => sounds.coin(), 400);

  showScreen('gameover');
  updateMenu();
}

function mainAction() {
  if (state === 'idle') cast();
  else if (state === 'biting') hook();
}

actionBtn.onclick = mainAction;
exitBtn.addEventListener('click', () => endGame(false));

// ==================== НАВИГАЦИЯ ====================
document.getElementById('playBtn').addEventListener('click', () => startGame());
document.getElementById('shopBtn').addEventListener('click', () => {
  updateMenu();
  renderShop();
  showScreen('shopScreen');
});
document.getElementById('shopBackBtn').addEventListener('click', () => {
  updateMenu();
  showScreen('mainMenu');
});
document.getElementById('restartBtn').addEventListener('click', () => startGame());
document.getElementById('menuBtn').addEventListener('click', () => {
  updateMenu();
  showScreen('mainMenu');
});
document.getElementById('encyclBtn').addEventListener('click', () => {
  renderEncycl();
  showScreen('encyclScreen');
});
document.getElementById('encyclBackBtn').addEventListener('click', () => {
  updateMenu();
  showScreen('mainMenu');
});
document.getElementById('achievBtn').addEventListener('click', () => {
  renderAchiev();
  showScreen('achievScreen');
});
document.getElementById('achievBackBtn').addEventListener('click', () => {
  updateMenu();
  showScreen('mainMenu');
});

// ==================== МАГАЗИН ====================
let currentTab = 'rods';

function renderShop() {
  const items = SHOP_ITEMS[currentTab];
  const ownedIds = save.owned[currentTab] || [];
  const equippedId = save.equipped[currentTab];

  document.getElementById('shopList').innerHTML = items.map(item => {
    const owned = ownedIds.includes(item.id);
    const equipped = equippedId === item.id;
    const canAfford = save.coins >= item.price;
    let btn;
    if (equipped) btn = `<button class="item-btn equipped" disabled>Надето</button>`;
    else if (owned) btn = `<button class="item-btn equip" data-action="equip" data-id="${item.id}">Надеть</button>`;
    else btn = `<button class="item-btn buy" data-action="buy" data-id="${item.id}" ${canAfford ? '' : 'disabled'}>${item.price} ₽</button>`;

    let icon = '';
    if (currentTab === 'rods') icon = `<svg viewBox="0 0 50 50" width="38" height="38"><line x1="10" y1="42" x2="38" y2="8" stroke="#8B5A2B" stroke-width="3.5" stroke-linecap="round"/><circle cx="38" cy="8" r="3" fill="#5D3A1A"/><path d="M38 10 Q42 22 40 32" stroke="#DDD" stroke-width="1.2" fill="none"/><circle cx="40" cy="34" r="3" fill="#E74C3C"/></svg>`;
    if (currentTab === 'baits') icon = `<svg viewBox="0 0 50 50" width="38" height="38"><circle cx="25" cy="25" r="13" fill="#8B5A2B"/><circle cx="21" cy="22" r="3" fill="#5D3A1A"/><circle cx="28" cy="28" r="2.5" fill="#5D3A1A"/></svg>`;
    if (currentTab === 'gear') icon = `<svg viewBox="0 0 50 50" width="38" height="38"><rect x="10" y="20" width="30" height="20" rx="3" fill="#7F8C8D" stroke="#566573" stroke-width="1.5"/><path d="M10 20 L18 12 L32 12 L40 20" fill="#95A5A6" stroke="#566573" stroke-width="1.5"/></svg>`;

    let durabilityHTML = '';
    if (currentTab === 'rods' && item.durability) {
      const dur = save.durability[item.id] ?? 100;
      durabilityHTML = `<div class="durability-bar"><div class="durability-fill ${dur < 40 ? 'warning' : ''}" style="width:${dur}%"></div></div>`;
    }

    return `
      <div class="list-item ${owned ? 'owned' : ''}">
        <div class="item-icon">${icon}</div>
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-desc">${item.desc}</div>
          ${durabilityHTML}
        </div>
        ${btn}
      </div>`;
  }).join('');

  document.getElementById('shopCoins').textContent = save.coins;
}

document.getElementById('shopList').addEventListener('click', e => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  const item = SHOP_ITEMS[currentTab].find(i => i.id === id);
  if (!item) return;

  if (action === 'buy') {
    if (save.coins < item.price) { showToast('Недостаточно монет'); return; }
    save.coins -= item.price;
    save.owned[currentTab].push(id);
    save.equipped[currentTab] = id;
    if (currentTab === 'rods') save.durability[id] = 100;
    sounds.coin();
    showToast(`Куплено: ${item.name}`);
  } else if (action === 'equip') {
    save.equipped[currentTab] = id;
    showToast(`Надето: ${item.name}`);
  }
  persistSave();
  renderShop();
  updateMenu();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    renderShop();
  });
});

// ==================== ЭНЦИКЛОПЕДИЯ ====================
function renderEncycl() {
  const total = BASE_FISH.filter(f => f.key !== 'boot').length;
  let caughtCount = 0;
  document.getElementById('encyclList').innerHTML = BASE_FISH.map(f => {
    const caught = save.caught[f.key] || 0;
    if (caught > 0 && f.key !== 'boot') caughtCount++;
    return `
      <div class="list-item ${caught > 0 ? '' : 'locked'}">
        <div class="item-icon">${fishSVG(f.key, 38)}</div>
        <div class="item-info">
          <div class="item-name">${f.name} <span class="rarity-badge ${'rarity-' + f.rarity}">${f.rarity}</span></div>
          <div class="item-desc">Вес: ${f.minKg}–${f.maxKg} кг · Очков: ${f.points}</div>
          <div class="item-desc">Поймано: ${caught > 0 ? caught + ' раз' : '???'}</div>
        </div>
      </div>`;
  }).join('');
  document.getElementById('encyclCount').textContent = `${caughtCount}/${total}`;
}

// ==================== ДОСТИЖЕНИЯ ЭКРАН ====================
function renderAchiev() {
  document.getElementById('achievList').innerHTML = ACHIEVEMENTS.map(a => {
    const unlocked = save.unlockedAch.includes(a.id);
    return `
      <div class="list-item ${unlocked ? 'owned' : 'locked'}">
        <div class="item-icon" style="background:${unlocked ? 'rgba(255,215,0,0.2)' : 'rgba(0,0,0,0.3)'}">
          <svg viewBox="0 0 24 24" fill="${unlocked ? '#FFD700' : '#7F8C8D'}">
            <path d="M12 2 L15 9 L22 9 L16 14 L18 21 L12 17 L6 21 L8 14 L2 9 L9 9 Z"/>
          </svg>
        </div>
        <div class="item-info">
          <div class="item-name">${a.name}</div>
          <div class="item-desc">${a.desc}</div>
        </div>
      </div>`;
  }).join('');
  document.getElementById('achievCount').textContent = `${save.unlockedAch.length}/${ACHIEVEMENTS.length}`;
}

// ==================== СТАРТ ====================
updateMenu();
updateHUD();
pickWeather();
applyTimeOfDay();
showScreen('mainMenu');

window.addEventListener('beforeunload', () => {
  if (animFrame) cancelAnimationFrame(animFrame);
});
</script>
